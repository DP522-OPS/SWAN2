                                </h3>
                                <div>
                                    <label className="field-label">Referencia / Programa</label>
                                    <input value={s.header.referencia} onChange={e=>onUpdate(s.id,'header.referencia',e.target.value)} placeholder="Ej. REF-2024-001"/>
                                </div>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                                    <div>
                                        <label className="field-label">Talla</label>
                                        <input value={s.header.talla} onChange={e=>onUpdate(s.id,'header.talla',e.target.value)}/>
                                    </div>
                                    <div>
                                        <label className="field-label" style={{color:'#10b981'}}>Tubos / Doc</label>
                                        <input type="number" value={s.header.tubosPorDocena}
                                            onChange={e=>onUpdate(s.id,'header.tubosPorDocena',e.target.value)}
                                            style={{color:'#10b981', fontWeight:800}}/>
                                    </div>
                                </div>
                                <div>
                                    <label className="field-label">Tecnología de máquina</label>
                                    <select value={s.header.tipoMaquina} onChange={e=>onMachineChange(s.id,e.target.value)}>
                                        <option value="Santoni">Santoni</option>
                                        <option value="Lonati">Lonati</option>
                                    </select>
                                </div>
                                {s.header.tipoMaquina === 'Santoni' && (
                                    <div style={{background:'#0a1628', border:'1px solid #1e3a5f', borderRadius:12, padding:12, display:'flex', flexDirection:'column', gap:10}}>
                                        <div>
                                            <label className="field-label" style={{color:'#3b82f6'}}>Modelo Santoni</label>
                                            <select value={s.header.maquinaModelo} onChange={e=>onUpdate(s.id,'header.maquinaModelo',e.target.value)}>
                                                {['TOP2V','SM4','TOP1'].map(m=><option key={m} value={m}>{m}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="field-label" style={{color:'#3b82f6'}}>Diámetro</label>
                                            <select value={s.header.diametro} onChange={e=>onUpdate(s.id,'header.diametro',e.target.value)}>
                                                {[13,14,15,16,17,18,20,22].map(d=><option key={d} value={d}>{d}" pulgadas</option>)}
                                            </select>
                                        </div>
                                    </div>
                                )}
                                {s.header.tipoMaquina === 'Lonati' && (
                                    <div style={{background:'#091a0f', border:'1px solid #1a3a22', borderRadius:12, padding:12}}>
                                        <label className="field-label" style={{color:'#10b981'}}>Modelo Lonati</label>
                                        <select value={s.header.maquinaModelo} onChange={e=>onUpdate(s.id,'header.maquinaModelo',e.target.value)}>
                                            {['LAO2MJ','LA04JS','B16','GL615','416E'].map(m=><option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>
                                )}
                                <div>
                                    <label className="field-label">Alimentadores activos</label>
                                    <input type="number" value={s.header.alimentadores||''} placeholder="Ej. 8"
                                        onChange={e=>onUpdate(s.id,'header.alimentadores',e.target.value)}/>
                                </div>

                                {/* Especificaciones de producción */}
                                <div style={{borderTop:'1px solid #1f2937', paddingTop:16}}>
                                    <h3 style={{margin:'0 0 12px', fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.12em', display:'flex', alignItems:'center', gap:6}}>
                                        <Ico.Clock/> Producción
                                    </h3>
                                    <label className="field-label">Peso unitario (g)</label>
                                    <input type="number" value={s.specs.pesoUnitarioGramos} style={{marginBottom:10, color:'#3b82f6', fontWeight:800}}
                                        onChange={e=>onUpdate(s.id,'specs.pesoUnitarioGramos',e.target.value)}/>

                                    <label className="field-label">Tiempo ciclo máquina</label>
                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                        <div>
                                            <input type="number" value={s.specs.tiempoMin} placeholder="min"
                                                onChange={e=>onUpdate(s.id,'specs.tiempoMin',e.target.value)}/>
                                            <p style={{fontSize:9, color:'#4b5563', textAlign:'center', margin:'3px 0 0', fontWeight:600}}>MINUTOS</p>
                                        </div>
                                        <div>
                                            <input type="number" value={s.specs.tiempoSeg} placeholder="seg"
                                                onChange={e=>onUpdate(s.id,'specs.tiempoSeg',e.target.value)}/>
                                            <p style={{fontSize:9, color:'#4b5563', textAlign:'center', margin:'3px 0 0', fontWeight:600}}>SEGUNDOS</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Métricas producción */}
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                    <div style={{background:'#0d1520', border:'1px solid #1f2e42', borderRadius:10, padding:12, textAlign:'center'}}>
                                        <p style={{fontSize:9, color:'#4b5563', margin:'0 0 4px', fontWeight:700, textTransform:'uppercase'}}>Peso Docena</p>
                                        <p className="mono" style={{fontSize:20, fontWeight:700, margin:0, color:'#3b82f6'}}>{dW.toFixed(0)}</p>
                                        <p style={{fontSize:9, color:'#374151', margin:0, fontWeight:600}}>GRAMOS</p>
                                    </div>
                                    <div style={{background: docsPerDay>0 ? '#09201a':'#0d1520', border:`1px solid ${docsPerDay>0?'#065f46':'#1f2e42'}`, borderRadius:10, padding:12, textAlign:'center'}}>
                                        <p style={{fontSize:9, color:'#4b5563', margin:'0 0 4px', fontWeight:700, textTransform:'uppercase'}}>Cap. 24h</p>
                                        <p className="mono" style={{fontSize:20, fontWeight:700, margin:0, color: docsPerDay>0?'#10b981':'#374151'}}>{docsPerDay}</p>
                                        <p style={{fontSize:9, color:'#374151', margin:0, fontWeight:600}}>DOC/DÍA</p>
                                    </div>
                                </div>
                            </div>

                            {/* Columna derecha: Composición */}
                            <div style={{display:'flex', flexDirection:'column', gap:16}}>
                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                    <h3 style={{margin:0, fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.12em'}}>
                                        Composición y torsión
                                    </h3>
                                    <div style={{display:'flex', gap:6}}>
                                        <button
                                            className="no-print"
                                            title="Aplicar composición calculada por titulación a todas las fibras"
                                            onClick={()=>{
                                                composicionSugerida.forEach(sg=>{
                                                    if(sg.porcentaje>0) onFibraUpdate(s.id, sg.idx, 'porcentaje', sg.porcentaje);
                                                });
                                            }}
                                            style={{padding:'5px 11px', borderRadius:8, background:'rgba(16,185,129,0.15)',
                                                border:'1px solid #10b981', color:'#10b981', fontSize:9,
                                                fontWeight:800, cursor:'pointer', textTransform:'uppercase',
                                                letterSpacing:'0.06em', display:'flex', alignItems:'center', gap:4}}>
                                            ⟳ Sugerir %
                                        </button>
                                        <button className="btn btn-emerald no-print" style={{fontSize:10, padding:'5px 12px'}}
                                            onClick={()=>onFibraUpdate(s.id, s.fibras.length, 'nombre', 'Nylon Tex')}>
                                            <Ico.Plus/> Añadir hilo
                                        </button>
                                    </div>
                                </div>

                                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:12}}>
                                    {s.fibras.map((f, fi) => (
                                        <FibraCard key={fi} f={f} fi={fi} sid={s.id}
                                            dW={dW}
                                            onUpdate={onFibraUpdate}
                                            onRemove={onFibraRemove}
                                            canRemove={s.fibras.length > 1}
                                            sugerido={getSugerido(fi)}
                                            totalAlim={s.header.alimentadores||8}
                                         />
                                    ))}
                                </div>

                                {/* Indicador mezcla total */}
                                <div style={{
                                    borderRadius:12, padding:'14px 20px',
                                    display:'flex', justifyContent:'space-between', alignItems:'center',
                                    background: totalPct===100 ? 'rgba(16,185,129,0.12)' : 'rgba(220,38,38,0.08)',
                                    border: `1.5px solid ${totalPct===100?'#10b981':'#dc2626'}`,
                                }}>
                                    <div style={{display:'flex', alignItems:'center', gap:12}}>
                                        {totalPct === 100
                                            ? <span style={{color:'#10b981'}}><Ico.Check/></span>
                                            : <span style={{color:'#ef4444'}}><Ico.Warning/></span>
                                        }
                                        <div>
                                            <p style={{margin:0, fontSize:11, fontWeight:800, color: totalPct===100?'#10b981':'#ef4444', textTransform:'uppercase'}}>
                                                {totalPct===100 ? 'Composición válida' : `Diferencia: ${Math.abs(100-totalPct)}%`}
                                            </p>
                                            <p style={{margin:0, fontSize:9, color:'#4b5563', fontWeight:600}}>
                                                {totalPct===100 ? 'La mezcla suma exactamente 100%' : 'La suma de porcentajes debe ser 100%'}
                                            </p>
                                            {totalPct===100 && textoEtiqueta && (
                                                <div style={{
                                                    marginTop:6, background:'#0a1628',
                                                    border:'1px solid #1e3a5f', borderRadius:7,
                                                    padding:'4px 10px', display:'inline-flex',
                                                    alignItems:'center', gap:6
                                                }}>
                                                    <span style={{fontSize:8, fontWeight:800, color:'#3b82f6', textTransform:'uppercase', letterSpacing:'0.1em'}}>Etiqueta:</span>
                                                    <span style={{fontSize:10, fontWeight:700, color:'#93c5fd', fontFamily:'monospace'}}>{textoEtiqueta}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                                        <MiniDonut fibras={s.fibras}/>
                                        <span className="mono" style={{fontSize:28, fontWeight:700, color: totalPct===100?'#10b981':'#ef4444'}}>{totalPct}%</span>
                                    </div>
                                </div>

                                {/* Barra distribución costos */}
                                {totalCost > 0 && (
                                    <div style={{background:'#0d1520', border:'1px solid #1f2e42', borderRadius:12, padding:14}}>
                                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
                                            <p style={{margin:0, fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.1em'}}>
                                                <Ico.Dollar/> Distribución de costo
                                            </p>
                                            <span className="mono" style={{fontSize:16, fontWeight:700, color:'#10b981'}}>${totalCost.toFixed(2)} USD/doc</span>
                                        </div>
                                        <CostBar fibras={s.fibras} dozenW={dW}/>
                                        <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:10}}>
                                            {s.fibras.filter(f=>f.porcentaje>0).map((f,i)=>(
                                                <div key={i} style={{display:'flex', alignItems:'center', gap:4, fontSize:10, color:'#6b7280', fontWeight:600}}>
                                                    <span style={{width:8, height:8, borderRadius:2, background:COLORS_BY_TYPE[f.nombre]||'#6b7280', flexShrink:0}}/>
                                                    {f.nombre} {f.titulo && `(${f.titulo})`}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ── PANEL TORSIONES ── */}
                        <div style={{
                            marginTop:24, background:'linear-gradient(135deg,#0a0e1a,#0d1520)',
                            border:'1px solid #1f2e42', borderRadius:16, padding:20
                        }}>
                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10}}>
                                <h4 style={{margin:0, fontSize:11, fontWeight:800, color:'#3b82f6', textTransform:'uppercase', letterSpacing:'0.12em'}}>
                                    Resumen consumo por torsión S/Z
                                </h4>
                                <div style={{
                                    background:'rgba(16,185,129,0.1)', border:'1px solid rgba(16,185,129,0.3)',
                                    borderRadius:8, padding:'6px 14px', fontSize:12, fontWeight:800, color:'#10b981'
                                }}>
                                    Costo MP Docena: <span style={{color:'#f1f5f9'}}>${totalCost.toFixed(2)} USD</span>
                                </div>
                            </div>
                            <div style={{display:'flex', flexWrap:'wrap', gap:12}}>
                                {s.fibras.map((f, fi) => {
                                    const gr = dW*(f.porcentaje/100);
                                    const cost = (gr/1000)*(parseFloat(f.costoKg)||0);
                                    const rigid = isRigid(f);
                                    const col = COLORS_BY_TYPE[f.nombre]||'#6b7280';
                                    return (
                                        <div key={fi} style={{
                                            background:'#111827', borderRadius:14, padding:16, minWidth:240, flex:'1 1 240px',
                                            borderLeft:`4px solid ${col}`, border:`1px solid #1f2e42`,
                                            borderLeftWidth:4, borderLeftColor:col
                                        }}>
                                            <div style={{display:'flex', justifyContent:'space-between', marginBottom:10}}>
                                                <div>
                                                    <p style={{margin:0, fontSize:10, fontWeight:800, color:col, textTransform:'uppercase'}}>{f.nombre||'—'}</p>
                                                    <p style={{margin:'2px 0 0', fontSize:9, color:'#4b5563', fontWeight:600}}>
                                                        {f.titulo||'—'} {f.lote?`· ${f.lote}`:''}
                                                    </p>
                                                </div>
                                                <span className="mono" style={{fontSize:10, color:'#4b5563'}}>${(parseFloat(f.costoKg)||0).toFixed(2)}/kg</span>
                                            </div>
                                            {/* totales */}
                                            <div style={{background:'#0d1520', borderRadius:8, padding:'8px 12px',
                                                display:'flex', justifyContent:'space-between', marginBottom:10}}>
                                                <div>
                                                    <p style={{margin:0, fontSize:8, color:'#4b5563', fontWeight:700, textTransform:'uppercase'}}>Consumo total</p>
                                                    <p className="mono" style={{margin:0, fontSize:17, fontWeight:700, color:'#e2e8f0'}}>{gr.toFixed(1)} <small style={{fontSize:9,color:'#4b5563'}}>gr</small></p>
                                                </div>
                                                <div style={{textAlign:'right'}}>
                                                    <p style={{margin:0, fontSize:8, color:'#4b5563', fontWeight:700, textTransform:'uppercase'}}>Costo docena</p>
                                                    <p className="mono" style={{margin:0, fontSize:17, fontWeight:700, color:'#10b981'}}>${cost.toFixed(2)}</p>
                                                </div>
                                            </div>
                                            {/* torsiones */}
                                            {rigid ? (
                                                <div style={{textAlign:'center', padding:'8px 0'}}>
                                                    <span className="badge torsion-r" style={{marginBottom:6}}>Rígido · Sin torsión</span>
                                                    <p className="mono" style={{fontSize:20, fontWeight:700, color:'#e2e8f0', margin:'4px 0 2px'}}>{gr.toFixed(1)} gr</p>
                                                    <p style={{fontSize:10, color:'#4b5563', fontWeight:600}}>{f.itemS||'—'}</p>
                                                </div>
                                            ) : (
                                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                                    {[{label:'S',item:f.itemS,cls:'torsion-s'},{label:'Z',item:f.itemZ,cls:'torsion-z'}].map(t=>(
                                                        <div key={t.label} style={{textAlign:'center', background:'#0d1520', borderRadius:8, padding:10}}>
                                                            <span className={`badge ${t.cls}`} style={{marginBottom:4}}>Tor. {t.label}</span>
                                                            <p className="mono" style={{fontSize:18, fontWeight:700, color:'#e2e8f0', margin:'4px 0 2px'}}>{(gr/2).toFixed(1)} <small style={{fontSize:8,color:'#4b5563'}}>gr</small></p>
                                                            <p style={{fontSize:9, color:'#4b5563', fontWeight:600}}>{t.item||'—'}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Observaciones */}
                        <div style={{marginTop:16}}>
                            <label className="field-label" style={{marginBottom:6, display:'block'}}>Observaciones y notas de ingeniería</label>
                            <textarea value={s.observaciones}
                                onChange={e=>onUpdate(s.id,'observaciones',e.target.value)}
                                placeholder="Detalles de tejeduría, caídas de máquina, pruebas térmicas, ajustes de tensión…"
                                style={{minHeight:80, borderRadius:10, resize:'vertical', color:'#d1d5db', fontWeight:500}}
                            />
                        </div>
                    </div>
                )}
            </div>
        );
    };

    /* ══════════════════════════════════════════
       COMPONENTE FIBRA CARD
    ══════════════════════════════════════════ */
    const FibraCard = ({ f, fi, sid, dW, onUpdate, onRemove, canRemove, sugerido, totalAlim }) => {
        const tituloOptions = [...new Set(HILOS_DB.filter(p=>p.tipo===f.nombre).map(p=>p.titulo))];
        const loteOptions   = HILOS_DB.filter(p=>p.tipo===f.nombre && p.titulo===f.titulo).map(p=>p.lote);
        const rigid = isRigid(f);
        const gr = dW * (f.porcentaje/100);
        const cost = (gr/1000) * (parseFloat(f.costoKg)||0);
        const col = COLORS_BY_TYPE[f.nombre]||'#6b7280';
        // Composición sugerida
        const dtexVal    = getDtexEfectivo(f.nombre, f.titulo);
        const esSp       = esSpandexDesnudo(f.nombre, f.titulo);
        const hayTitulo  = f.titulo && f.titulo!=='';
        const diffSug    = sugerido !== null && sugerido !== undefined && hayTitulo && sugerido !== f.porcentaje;
        const nombreEtiq = NOMBRE_ETIQUETA[f.nombre] || f.nombre;

        return (
            <div className="fiber-card" style={{borderLeft:`3px solid ${col}`}}>
                {canRemove && (
                    <button className="no-print"
                        onClick={()=>onRemove(sid, fi)}
                        style={{position:'absolute', top:8, right:8, background:'#dc2626', color:'#fff',
                            border:'none', borderRadius:6, width:22, height:22, cursor:'pointer',
                            display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, lineHeight:1}}>×</button>
                )}

                <div style={{display:'flex', flexDirection:'column', gap:10}}>
                    <div>
                        <label className="field-label">Tipo de fibra</label>
                        <select value={f.nombre} onChange={e=>onUpdate(sid,fi,'nombre',e.target.value)}>
                            <option value="Nylon Tex">Nylon Tex (Texturizado)</option>
                            <option value="Nylon Rig">Nylon Rig (Rígido)</option>
                            <option value="Lycra">Lycra / Spandex</option>
                            <option value="Poliester">Poliéster</option>
                            <option value="Jaspe">Jaspe</option>
                                        <option value="Modal">Modal</option>
                        </select>
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                        <div>
                            <label className="field-label">Título</label>
                            <select value={f.customTitulo?'CUSTOM':f.titulo}
                                onChange={e=>onUpdate(sid,fi,'titulo',e.target.value)}>
                                <option value="">— Seleccionar —</option>
                                {tituloOptions.map(t=><option key={t} value={t}>{t}</option>)}
                                <option value="CUSTOM">Otro…</option>
                            </select>
                            {f.customTitulo && (
                                <input value={f.titulo} placeholder="Título personalizado"
                                    onChange={e=>onUpdate(sid,fi,'titulo_raw',e.target.value)}
                                    style={{marginTop:4, fontSize:12}}/>
                            )}
                        </div>
                        <div>
                            <label className="field-label">Lote / Partida</label>
                            <select value={f.customLote?'CUSTOM':f.lote}
                                disabled={!f.titulo && !f.customTitulo}
                                onChange={e=>onUpdate(sid,fi,'lote',e.target.value)}>
                                <option value="">— Lote —</option>
                                {loteOptions.map(l=><option key={l} value={l}>{l}</option>)}
                                <option value="CUSTOM">Otro…</option>
                            </select>
                            {f.customLote && (
                                <input value={f.lote} placeholder="Lote personalizado"
                                    onChange={e=>onUpdate(sid,fi,'lote_raw',e.target.value)}
                                    style={{marginTop:4, fontSize:12}}/>
                            )}
                        </div>
                    </div>

                    {/* Items S/Z */}
                    <div style={{background:'#0a0e1a', borderRadius:8, padding:10, display:'grid', gridTemplateColumns: rigid?'1fr':'1fr 1fr', gap:8}}>
                        {rigid ? (
                            <div>
                                <label className="field-label">Item (Rígido)</label>
                                <input value={f.itemS} onChange={e=>onUpdate(sid,fi,'itemS',e.target.value)} placeholder="Código item"/>
                            </div>
                        ) : (
                            <>
                                <div>
                                    <label className="field-label" style={{color:'#3b82f6'}}>
                                        <span style={{background:'#1d4ed8', color:'#bfdbfe', padding:'1px 5px', borderRadius:4, fontSize:9, marginRight:4, fontWeight:900}}>S</span>
                                        Item
                                    </label>
                                    <input value={f.itemS} onChange={e=>onUpdate(sid,fi,'itemS',e.target.value)} placeholder="Item S"/>
                                </div>
                                <div>
                                    <label className="field-label" style={{color:'#6b7280'}}>
                                        <span style={{background:'#374151', color:'#d1d5db', padding:'1px 5px', borderRadius:4, fontSize:9, marginRight:4, fontWeight:900}}>Z</span>
                                        Item
                                    </label>
                                    <input value={f.itemZ} onChange={e=>onUpdate(sid,fi,'itemZ',e.target.value)} placeholder="Item Z"/>
                                </div>
                            </>
                        )}
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                        <div>
                            <label className="field-label" style={{color:'#10b981'}}>% Participación</label>
                            <input type="number" value={f.porcentaje} min="0" max="100"
                                onChange={e=>onUpdate(sid,fi,'porcentaje',e.target.value)}
                                style={{color:'#10b981', fontWeight:800, textAlign:'center'}}/>
                        </div>
                        <div>
                            <label className="field-label">Costo Kg (USD)</label>
                            <input type="number" value={f.costoKg||''}
                                onChange={e=>onUpdate(sid,fi,'costoKg',e.target.value)}
                                placeholder="0.00" style={{textAlign:'center'}}/>
                        </div>
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                        <div>
                            <label className="field-label">Proveedor</label>
                            <input value={f.proveedor} onChange={e=>onUpdate(sid,fi,'proveedor',e.target.value)} placeholder="Ej. Fujian"/>
                        </div>
                        <div>
                            <label className="field-label" style={{color:'#f59e0b'}}>Parte de prenda</label>
                            <select value={f.partePrenda||''} onChange={e=>onUpdate(sid,fi,'partePrenda',e.target.value)}
                                style={{background:'#0d1520', border:'1px solid #2a3a50', color:'#fcd34d', fontWeight:700, fontSize:11}}>
                                <option value=''>— Zona —</option>
                                {['PUÑO 1','PUÑO 2','CUERPO','PIERNA','ENTREPIERNA','CINTURA','BOTA','TALÓN','PUNTA','TODA LA PRENDA'].map(p=>(
                                    <option key={p} value={p}>{p}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* Mini resumen costo si hay datos */}
                    {gr > 0 && (
                        <div style={{borderTop:'1px solid #1f2937', paddingTop:8, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                            <span style={{fontSize:9, color:'#4b5563', fontWeight:700, textTransform:'uppercase'}}>Consumo docena</span>
                            <div style={{display:'flex', gap:12}}>
                                <span className="mono" style={{fontSize:11, color:'#d1d5db', fontWeight:700}}>{gr.toFixed(1)} gr</span>
                                {cost > 0 && <span className="mono" style={{fontSize:11, color:'#10b981', fontWeight:700}}>${cost.toFixed(2)}</span>}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
