        // Spandex desnudo — % DECLARADO MANUAL según zona de la prenda
        { tipo:'Lycra', titulo:'Spandex 140', denNucleo:140, dtexCob:0, dtex:44.44, esSpandex:true, lote:'09609', itemS:'2142', itemZ:'', proveedor:'Xiamen' },
        { tipo:'Lycra', titulo:'Lycra 17-8-5',  denNucleo:17, dtexCob:8, dtex:13.40, lote:'05-954',  itemS:'5243', itemZ:'5244', proveedor:'Fujian' },
        { tipo:'Lycra', titulo:'Lycra 17-8-5',  denNucleo:17, dtexCob:8, dtex:13.40, lote:'05-961',  itemS:'5243', itemZ:'5244', proveedor:'Fujian' },
        { tipo:'Lycra', titulo:'Lycra 20-8-5',  denNucleo:20, dtexCob:8, dtex:14.35, lote:'05-963',  itemS:'4590', itemZ:'4591', proveedor:'Fujian' },
        { tipo:'Lycra', titulo:'Spandex 15', denNucleo:15, dtexCob:0, dtex:4.76, esSpandex:true, lote:'C2167G', itemS:'2138', itemZ:'', proveedor:'Xiamen' },
        // ── Poliéster ─────────────────────────────────────────────────
        { tipo:'Poliester', titulo:'Poliéster 50/72',  dtex:50, lote:'YD77001',  itemS:'9515', itemZ:'', proveedor:'Fujian' },
        { tipo:'Poliester', titulo:'Poliéster 75D/72', dtex:75, lote:'7572Q559', itemS:'9516', itemZ:'', proveedor:'Fujian' },
        // ── Modal — Nm inverso: dtex = 10.000/Nm ─────────────────────
        { tipo:'Modal', titulo:'Nm 40/1', dtex:250, nm:40, lote:'1861472', itemS:'9264', itemZ:'9264', proveedor:'Jiangsu' },
        // ── Jaspe — hilo compuesto, 1 sola entrada en precosteo ───────
        { tipo:'Jaspe', titulo:'Jaspe 44/34+50/72', dtex:47, lote:'04-224', itemS:'7091', itemZ:'7092', proveedor:'Fujian' },
    ];

    // Nombres en etiqueta ICONTEC para composición
    const NOMBRE_ETIQUETA = {
        'Nylon Tex':  'Poliamida',
        'Nylon Rig':  'Poliamida',
        'Lycra':      'Elastano',
        'Poliester':  'Poliéster',
        'Modal':      'Modal',
        'Jaspe':      'Poliamida/Poliéster',
    };

    const COLORS_BY_TYPE = {
        'Nylon Tex': '#3b82f6',
        'Nylon Rig': '#8b5cf6',
        'Lycra':     '#10b981',
        'Poliester': '#f59e0b',
        'Modal':     '#ec4899',
        'Jaspe':     '#ef4444',
    };

    const isRigid = f => {
        if (!f) return false;
        if (f.nombre==='Nylon Rig' || f.nombre==='Poliester' || f.nombre==='Modal') return true;
        if (f.nombre==='Lycra' && f.titulo && f.titulo.toLowerCase().includes('140')) return true;
        return false;
    };

    /* ══════════════════════════════════════════
       MOTOR DE COMPOSICIÓN POR TITULACIÓN
    ══════════════════════════════════════════ */

    // Obtiene dtex efectivo de un hilo según su título en HILOS_DB
    const getDtexEfectivo = (nombre, titulo) => {
        const preset = HILOS_DB.find(p => p.tipo===nombre && p.titulo===titulo);
        if (preset) return preset.dtex || 0;
        // Si es lycra cubierta manual (denNucleo/dtexCob)
        const t = (titulo||'').toUpperCase();
        // intentar parsear lycra: "22-40-34" → den=22, cob=40
        const mLycra = t.match(/(\d+)-(\d+)/);
        if (nombre==='Lycra' && mLycra) {
            const den = parseFloat(mLycra[1]);
            const cob = parseFloat(mLycra[2]);
            return (den*1.111/3.5) + cob;
        }
        // nylon tex: leer primer número
        const mNylon = t.match(/(\d+)/);
        if ((nombre==='Nylon Tex'||nombre==='Nylon Rig') && mNylon) return parseFloat(mNylon[1]);
        // poliéster: leer primer número
        if (nombre==='Poliester' && mNylon) return parseFloat(mNylon[1]);
        // modal: si tiene Nm leer
        const mNm = t.match(/NM\s*(\d+)/);
        if (nombre==='Modal' && mNm) return 10000/parseFloat(mNm[1]);
        return 0;
    };

    // Verifica si es spandex desnudo (% declarado, no calculado)
    const esSpandexDesnudo = (nombre, titulo) => {
        if (nombre!=='Lycra') return false;
        const preset = HILOS_DB.find(p=>p.tipo===nombre&&p.titulo===titulo);
        return !!(preset && preset.esSpandex) || (titulo||'').toLowerCase().includes('140');
    };

    /*
     * calcularComposicionSugerida(fibras, totalAlim, respuestas)
     *
     * respuestas = {
     *   spandexPct: number,      // % elastómero declarado (cintura, shapewear…)
     *   bodyFreshPct: number,    // % Body Fresh declarado (entrepierna)
     * }
     *
     * Reglas por tipo:
     *  - Modal presente           → preset 85/10/5
     *  - Spandex 140              → respuestas.spandexPct (o default 1)
     *  - Body Fresh               → respuestas.bodyFreshPct (o default 5)
     *  - Lycra cubierta / Nylon / Poliéster → dtex efectivo ponderado por alim
     */
    const esBodyFresh = (f) => {
        const preset = HILOS_DB.find(p=>p.tipo===f.nombre && p.titulo===f.titulo);
        return !!(preset && preset.esBodyFresh);
    };

    const calcularComposicionSugerida = (fibras, totalAlim, respuestas) => {
        const alim = parseInt(totalAlim)||8;
        const resp = respuestas || {};

        // ── Modal: preset fijo ──────────────────────────────────────
        if (fibras.some(f=>f.nombre==='Modal')) {
            return fibras.map((f,i) => {
                if (f.nombre==='Modal')    return {idx:i, porcentaje:85};
                if (f.nombre==='Lycra')    return {idx:i, porcentaje:10};
                return {idx:i, porcentaje:5};
            });
        }

        // ── Identificar fibras especiales ───────────────────────────
        const spandexIdxs   = fibras.map((f,i)=>({f,i})).filter(({f})=>esSpandexDesnudo(f.nombre,f.titulo)).map(({i})=>i);
        const bodyFreshIdxs = fibras.map((f,i)=>({f,i})).filter(({f})=>esBodyFresh(f)).map(({i})=>i);

        const spandexPct   = spandexIdxs.length   ? ((resp.spandexPct != null ? resp.spandexPct : parseFloat(fibras[spandexIdxs[0]].porcentaje) || 1)) : 0;
        const bodyFreshPct = bodyFreshIdxs.length ? ((resp.bodyFreshPct != null ? resp.bodyFreshPct : parseFloat(fibras[bodyFreshIdxs[0]].porcentaje) || 5)) : 0;

        const reservado = spandexPct + bodyFreshPct;
        const baseDisp  = Math.max(0, 100 - reservado);

        // ── dtex ponderado para fibras base (nylon, lycra, poliéster) ─
        const fibraBase = fibras.map((f,i) => {
            if (spandexIdxs.includes(i))   return {idx:i, dtex:0, tipo:'spandex'};
            if (bodyFreshIdxs.includes(i)) return {idx:i, dtex:0, tipo:'bodyFresh'};
            const alimFibra = parseFloat(f.alimFibra)||alim;
            const dtex = getDtexEfectivo(f.nombre, f.titulo);
            return {idx:i, dtex: dtex * (alimFibra/alim), tipo:'base'};
        });

        const totalDtex = fibraBase.reduce((a,x)=>a+x.dtex, 0);

        let resultados = fibraBase.map(x => {
            if (x.tipo==='spandex')   return {idx:x.idx, porcentaje:spandexPct};
            if (x.tipo==='bodyFresh') return {idx:x.idx, porcentaje:bodyFreshPct};
            if (totalDtex===0)        return {idx:x.idx, porcentaje:0};
            return {idx:x.idx, porcentaje: (x.dtex/totalDtex)*baseDisp};
        });

        // ── Redondear y ajustar para sumar 100 ─────────────────────
        let rounded = resultados.map(r=>({...r, porcentaje:Math.round(r.porcentaje)}));
        let suma = rounded.reduce((a,r)=>a+r.porcentaje,0);
        if (suma !== 100) {
            const bases = rounded.filter(r=>fibraBase[r.idx] && fibraBase[r.idx].tipo==='base');
            if (bases.length) {
                const mayor = bases.reduce((a,b)=>b.porcentaje>a.porcentaje?b:a);
                rounded.find(r=>r.idx===mayor.idx).porcentaje += (100-suma);
            }
        }
        return rounded;
    };

    /* Detecta si la combinación necesita preguntas antes de sugerir */
    const necesitaAsistente = (fibras) => {
        const tieneSpandex   = fibras.some(f=>esSpandexDesnudo(f.nombre,f.titulo));
        const tieneBodyFresh = fibras.some(f=>esBodyFresh(f));
        return (tieneSpandex || tieneBodyFresh) && fibras.filter(f=>f.titulo).length >= 2;
    };

    const applyTechnicalRules = (fibras, totalAlim, respuestas) => {
        const conTitulo = fibras.filter(f=>f.titulo&&f.titulo!=='');
        if (conTitulo.length < 1) return fibras;
        const sugeridos = calcularComposicionSugerida(fibras, totalAlim||8, respuestas);
        return fibras.map((f,i) => {
            const s = sugeridos.find(x=>x.idx===i);
            if (s && s.porcentaje > 0) return {...f, porcentaje: s.porcentaje};
            return f;
        });
    };


    const newFibra = () => ({
        nombre:'Nylon Tex', titulo:'', lote:'', itemS:'', itemZ:'',
        proveedor:'', costoKg:0, porcentaje:0, alimFibra:null,
        partePrenda:'',
        customTitulo:false, customLote:false

    const newStructure = () => ({
        id: 'SW-' + Date.now().toString(36).toUpperCase(),
        nombrePrenda: 'NUEVA REFERENCIA',
        status: 'PENDIENTE',
        header: {
            referencia:'', talla:'L/XL',
            tipoMaquina:'Santoni', maquinaModelo:'TOP2V',
            tubosPorDocena:12, diametro:'17', alimentadores:8
        },
        specs: { pesoUnitarioGramos:0, tiempoMin:0, tiempoSeg:0 },
        fibras: [newFibra()],
        observaciones:'',
        createdAt: Date.now(),
        updatedAt: Date.now(),
    });

    /* ══════════════════════════════════════════
       ICONOS

    const Ico = {

    /* ══════════════════════════════════════════
       COMPONENTE MINI DONUT
    ══════════════════════════════════════════ */
    const MiniDonut = ({ fibras }) => {
        const total = fibras.reduce((a,f)=>a+(f.porcentaje||0),0);
        if (total === 0) return null;
        let cumul = 0;
        const R = 36, cx = 40, cy = 40, stroke = 14;
        const parts = fibras.filter(f=>f.porcentaje>0).map(f => {
            const pct = (f.porcentaje/total)*100;
            const start = cumul; cumul += pct;
            return { ...f, pct, start };
        });
        const arc = (pct, start) => {
            const r = R, full = 2*Math.PI*r;
            const dash = (pct/100)*full, gap = full - dash;
            const startAngle = (start/100)*2*Math.PI - Math.PI/2;
            const x = cx + r * Math.cos(startAngle);
            const y = cy + r * Math.sin(startAngle);
            return { strokeDasharray:`${dash} ${gap}`, strokeDashoffset: 0,
                     transform:`rotate(${(start/100)*360 - 90} ${cx} ${cy})`,
                     d:`M ${cx} ${cy-r}` };
        };
        return (
            <svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx={cx} cy={cy} r={R} fill="none" stroke="#1f2937" strokeWidth={stroke}/>
                {parts.map((p,i) => {
                    const full = 2*Math.PI*R;
                    const dash = (p.pct/100)*full;
                    const col = COLORS_BY_TYPE[p.nombre] || '#6b7280';
                    const off = (p.start/100)*full;
                    return (
                        <circle key={i} cx={cx} cy={cy} r={R} fill="none"
                            stroke={col} strokeWidth={stroke}
                            strokeDasharray={`${dash} ${full - dash}`}
                            strokeDashoffset={-off}
                            transform={`rotate(-90 ${cx} ${cy})`}
                        />
                    );
                })}
                <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle"
                    fill={total===100?"#10b981":"#ef4444"} fontSize="11" fontWeight="700" fontFamily="JetBrains Mono">
                    {total}%
                </text>
            </svg>
        );
    };

    /* ══════════════════════════════════════════
       COMPONENTE BARRA DE COSTO
    ══════════════════════════════════════════ */
    const CostBar = ({ fibras, dozenW }) => {
        const items = fibras.map(f => {
            const gr = dozenW * (f.porcentaje / 100);
            const cost = (gr/1000) * (parseFloat(f.costoKg)||0);
            return { nombre: f.nombre, cost, color: COLORS_BY_TYPE[f.nombre]||'#6b7280' };
        }).filter(i => i.cost > 0);
        const total = items.reduce((a,i)=>a+i.cost,0);
        if (total === 0) return null;
        return (
            <div style={{ display:'flex', gap:2, borderRadius:4, overflow:'hidden', height:8 }}>
                {items.map((item,i) => (
                    <div key={i} style={{
                        width: `${(item.cost/total)*100}%`,
                        background: item.color,
                        minWidth: 4
                    }} title={`${item.nombre}: $${item.cost.toFixed(2)}`}/>
                ))}
            </div>
        );
    };

        const [filterStatus, setFilterStatus] = useState('TODOS');
        const [expandedId, setExpandedId] = useState(null);
        const [activeTab, setActiveTab] = useState('precosteos');
        const fileInputRef = useRef(null);
        const printRef = useRef(null);

        /* ── Persistencia ── */
        useEffect(() => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) { setStructures(parsed); return; }
                }
            } catch(e) {}
            setStructures([newStructure()]);
        }, []);

        const persist = useCallback((data) => {
            setStructures(data);
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
        }, []);

        /* ── Resumen global ── */
        const globalSummary = useMemo(() => {
            let totalCost = 0, totalGr = 0;
            structures.forEach(s => {
                const tubos = parseInt(s.header.tubosPorDocena)||12;
                const dW = (parseFloat(s.specs.pesoUnitarioGramos)||0) * tubos;
                s.fibras.forEach(f => {
                    const gr = dW * (f.porcentaje/100);
                    totalGr += gr;
                    totalCost += (gr/1000)*(parseFloat(f.costoKg)||0);
                });
            });
            return { totalCost, totalKg: totalGr/1000, count: structures.length };
        }, [structures]);

        /* ── Filtros ── */
        const visibleStructures = useMemo(() => {
            let arr = structures;
            if (filterStatus !== 'TODOS') arr = arr.filter(s => s.status === filterStatus);
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                arr = arr.filter(s =>
                    s.nombrePrenda.toLowerCase().includes(q) ||
                    (s.header.referencia||'').toLowerCase().includes(q) ||
                    s.fibras.some(f => f.nombre.toLowerCase().includes(q) || f.titulo.toLowerCase().includes(q))
                );
            }
            return arr;
        }, [structures, filterStatus, searchQuery]);

        /* ── Mutaciones ── */
        const updateField = (id, path, val) => {
            const keys = path.split('.');
            const newData = structures.map(s => {
                if (s.id !== id) return s;
                const clone = JSON.parse(JSON.stringify(s));
                let cur = clone;
                for (let i = 0; i < keys.length-1; i++) cur = cur[keys[i]];
                cur[keys[keys.length-1]] = val;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const handleMachineChange = (id, val) => {
            const newData = structures.map(s => {
                if (s.id !== id) return s;
                const clone = JSON.parse(JSON.stringify(s));
                clone.header.tipoMaquina = val;
                clone.header.maquinaModelo = val === 'Santoni' ? 'TOP2V' : 'LAO2MJ';
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const updateFibra = (sid, idx, field, val) => {
            const newData = structures.map(s => {
                if (s.id !== sid) return s;
                const clone = JSON.parse(JSON.stringify(s));
                let fibras = [...clone.fibras];

                // add new row if idx === length
                if (idx === fibras.length) fibras.push(newFibra());

                let f = { ...fibras[idx] };

                if (field === 'nombre') {
                    f = { ...newFibra(), nombre: val };
                } else if (field === 'titulo') {
                    if (val === 'CUSTOM') {
                        f = { ...f, titulo:'', lote:'', itemS:'', itemZ:'', proveedor:'', customTitulo:true, customLote:true };
                    } else {
                        f.titulo = val;
                        f.customTitulo = false;
                        const preset = HILOS_DB.find(p => p.tipo === f.nombre && p.titulo === val);
                        if (preset) {
                            f.lote = preset.lote; f.itemS = preset.itemS;
                            f.itemZ = preset.itemZ; f.proveedor = preset.proveedor;
                            f.customLote = false;
                        } else {
                            f.lote=''; f.itemS=''; f.itemZ=''; f.proveedor='';
                        }
                    }
                } else if (field === 'lote') {
                    if (val === 'CUSTOM') {
                        f = { ...f, lote:'', itemS:'', itemZ:'', customLote:true };
                    } else {
                        f.lote = val;
                        f.customLote = false;
                        const preset = HILOS_DB.find(p => p.tipo===f.nombre && p.titulo===f.titulo && p.lote===val);
                        if (preset) { f.itemS = preset.itemS; f.itemZ = preset.itemZ; f.proveedor = preset.proveedor; }
                    }
                } else if (field === 'titulo_raw') { f.titulo = val; }
                else if (field === 'lote_raw')   { f.lote = val; }
                else if (field === 'porcentaje' || field === 'costoKg') { f[field] = parseFloat(val)||0; }
                else { f[field] = val; }

                fibras[idx] = f;
                if (field === 'nombre' || field === 'titulo' || field === 'alimFibra') fibras = applyTechnicalRules(fibras, clone.header.alimentadores);
                clone.fibras = fibras;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const removeFibra = (sid, idx) => {
            const newData = structures.map(s => {
                if (s.id !== sid) return s;
                const clone = JSON.parse(JSON.stringify(s));
                clone.fibras = clone.fibras.filter((_,i)=>i!==idx);
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const createNew = () => {
            const s = newStructure();
            persist([s, ...structures]);
            setExpandedId(s.id);
        };

        const deleteStructure = (id) => {
            if (!window.confirm('¿Eliminar esta ficha técnica? Esta acción no se puede deshacer.')) return;
            persist(structures.filter(s => s.id !== id));
        };

        /* ── Exportación Excel ── */
        const exportExcel = () => {
            const rows = [];
            structures.forEach((s, pi) => {
                const tubos = parseInt(s.header.tubosPorDocena)||12;
                const dW = (parseFloat(s.specs.pesoUnitarioGramos)||0)*tubos;
                s.fibras.forEach(f => {
                    const gr = dW*(f.porcentaje/100);
                    const cost = (gr/1000)*(parseFloat(f.costoKg)||0);
                    const rigid = isRigid(f);
                    const base = {
                        'PÁG': pi+1, 'PRENDA': s.nombrePrenda, 'REFERENCIA': s.header.referencia,
                        'TALLA': s.header.talla, 'ESTADO': s.status,
                        'MÁQUINA': s.header.tipoMaquina, 'MODELO': s.header.maquinaModelo,
                        'ALIMENTADORES': s.header.alimentadores||'',
                        'TUBOS/DOC': tubos,
                        ...(s.header.tipoMaquina==='Santoni' ? {'DIÁMETRO':s.header.diametro+'"'} : {}),
                        'FIBRA': f.nombre, 'TÍTULO': f.titulo,
                        'LOTE': f.lote, 'PROVEEDOR': f.proveedor,
                        '% PART.': f.porcentaje,
                        'COSTO KG (USD)': parseFloat(f.costoKg)||0,
                    };
                    if (rigid) {
                        rows.push({ ...base, 'TORSIÓN':'Rígido', 'ITEM':f.itemS,
                            'CONSUMO (g)': +gr.toFixed(2), 'COSTO DOC (USD)': +cost.toFixed(3) });
                    } else {
                        rows.push({ ...base, 'TORSIÓN':'S', 'ITEM':f.itemS,
                            'CONSUMO (g)': +(gr/2).toFixed(2), 'COSTO DOC (USD)': +(cost/2).toFixed(3) });
                        rows.push({ ...base, 'TORSIÓN':'Z', 'ITEM':f.itemZ,
                            'CONSUMO (g)': +(gr/2).toFixed(2), 'COSTO DOC (USD)': +(cost/2).toFixed(3) });
                    }
                });
            });
            if (!rows.length) { alert('No hay datos para exportar.'); return; }
            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            const cols = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, ...rows.map(r=>String(r[k]||'').length))+2 }));
            ws['!cols'] = cols;
            XLSX.utils.book_append_sheet(wb, ws, 'Fichas Swantex');
            XLSX.writeFile(wb, `Swantex_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.xlsx`);
        };

        /* ── Backup JSON ── */
        const exportBackup = () => {
            const blob = new Blob([JSON.stringify(structures, null, 2)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `Swantex_Backup_${Date.now()}.json`; a.click();
        };
        const importBackup = e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = ev => { try { const d = JSON.parse(ev.target.result); if (Array.isArray(d)) persist(d); } catch { alert('Archivo inválido.'); } };
            r.readAsText(f); e.target.value='';
        };

        /* ── PDF: jsPDF puro, 1 ficha = 1 hoja A4, sin html2canvas ── */
        const downloadPdf = () => {
            if (!structures.length) { alert('No hay fichas para exportar.'); return; }
            setIsExporting(true);

            setTimeout(() => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
                    const PW = 210, PH = 297;
                    const ML = 12, MR = 12, MT = 10;
                    const CW = PW - ML - MR; // usable width = 186mm

                    // ── helpers ──
                    const hex2rgb = h => {
                        const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
                        return [r,g,b];
                    };
                    const setFill = (hex) => { const [r,g,b]=hex2rgb(hex); doc.setFillColor(r,g,b); };
                    const setDraw = (hex) => { const [r,g,b]=hex2rgb(hex); doc.setDrawColor(r,g,b); };
                    const setTxt  = (hex) => { const [r,g,b]=hex2rgb(hex); doc.setTextColor(r,g,b); };

                    const fecha = new Date().toLocaleDateString('es-CO');
                    const total = structures.length;

                    structures.forEach((s, si) => {
                        if (si > 0) doc.addPage();

                        const tubos  = parseInt(s.header.tubosPorDocena)||12;
                        const dW     = (parseFloat(s.specs.pesoUnitarioGramos)||0)*tubos;
                        const cycleS = (parseInt(s.specs.tiempoMin)||0)*60+(parseInt(s.specs.tiempoSeg)||0);
                        const docsDay= cycleS>0 ? Math.floor(86400/cycleS/tubos) : 0;
                        const totalCost = s.fibras.reduce((acc,f)=>{
                            const gr=dW*(f.porcentaje/100);
                            return acc+(gr/1000)*(parseFloat(f.costoKg)||0);
                        },0);
                        const totalPct = s.fibras.reduce((a,f)=>a+(f.porcentaje||0),0);
                        const pageNum  = si+1;

                        let y = MT;

                        // ════════════════════════════════
                        // HEADER BAR
                        // ════════════════════════════════
                        setFill('#111827'); doc.rect(ML, y, CW, 14, 'F');

                        // Logo text
                        doc.setFont('helvetica','bold'); doc.setFontSize(13);
                        setTxt('#ffffff'); doc.text('TEXTILES', ML+3, y+5.5);
                        doc.setFontSize(13); setTxt('#10b981'); doc.text('SWANTEX', ML+33, y+5.5);
                        doc.setFontSize(7); setTxt('#9ca3af'); doc.text('SAS', ML+61, y+5.5);

                        // Subtítulo
                        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); setTxt('#6b7280');
                        doc.text('FICHA TÉCNICA DE INGENIERÍA', ML+3, y+10);

                        // Página y fecha (derecha)
                        doc.setFont('helvetica','bold'); doc.setFontSize(7); setTxt('#9ca3af');
                        doc.text(`Pág. ${pageNum} / ${total}   ·   ${fecha}`, PW-MR, y+5.5, {align:'right'});
                        doc.setFont('helvetica','normal'); doc.setFontSize(6); setTxt('#4b5563');
                        doc.text(s.id, PW-MR, y+10, {align:'right'});

                        // Estado badge
                        const stColors = {PENDIENTE:'#d97706',REVISIÓN:'#2563eb',APROBADO:'#059669'};
                        const stC = stColors[s.status]||'#6b7280';
                        const [sr,sg,sb]=hex2rgb(stC);
                        doc.setFillColor(sr,sg,sb); doc.roundedRect(PW-MR-22, y+10.5, 22, 4.5, 1,1,'F');
                        doc.setFont('helvetica','bold'); doc.setFontSize(5.5); setTxt('#ffffff');
                        doc.text(s.status, PW-MR-11, y+13.5, {align:'center'});

                        y += 17;

                        // ════════════════════════════════
                        // NOMBRE PRENDA
                        // ════════════════════════════════
                        doc.setFont('helvetica','bold'); doc.setFontSize(16); setTxt('#111111');
                        doc.text((s.nombrePrenda||'SIN NOMBRE').toUpperCase(), ML, y);
                        y += 5;
                        if (s.header.referencia) {
                            doc.setFont('helvetica','normal'); doc.setFontSize(7); setTxt('#6b7280');
                            doc.text('REF: '+s.header.referencia, ML, y);
                            y += 4;
                        }

                        // línea divisora
                        setDraw('#e5e7eb'); doc.setLineWidth(0.3); doc.line(ML, y, PW-MR, y);
                        y += 4;

                        // ════════════════════════════════
                        // PARÁMETROS TÉCNICOS — grid 4 columnas
                        // ════════════════════════════════
                        const params = [
                            ['Talla', s.header.talla],
                            ['Máquina', `${s.header.tipoMaquina} ${s.header.maquinaModelo}`],
                            ['Tubos/Doc', String(tubos)],
                            ['Alimentadores', String(s.header.alimentadores||'—')],
                            ...(s.header.tipoMaquina==='Santoni'?[['Diámetro',s.header.diametro+'"']]:[]),
                            ['Peso Unit.', `${s.specs.pesoUnitarioGramos||0} g`],
                            ['Peso x Doc.', `${dW.toFixed(1)} g`],
                            ['Ciclo', cycleS>0?`${s.specs.tiempoMin}min ${s.specs.tiempoSeg}s`:'—'],
                            ['Cap. 24h', docsDay>0?`${docsDay} doc/día`:'—'],
                        ];
                        const cols4 = 4, boxW = CW/cols4, boxH = 9;
                        params.forEach((p, pi) => {
                            const col = pi % cols4, row = Math.floor(pi/cols4);
                            const bx = ML + col*boxW, by = y + row*boxH;
                            setFill('#f8fafc'); setDraw('#e2e8f0'); doc.setLineWidth(0.2);
                            doc.roundedRect(bx+0.5, by+0.5, boxW-1, boxH-1, 1,1,'FD');
                            doc.setFont('helvetica','normal'); doc.setFontSize(6); setTxt('#9ca3af');
                            doc.text(p[0].toUpperCase(), bx+2.5, by+3.5);
                            doc.setFont('helvetica','bold'); doc.setFontSize(8); setTxt('#111111');
                            doc.text(String(p[1]), bx+2.5, by+7.5);
                        });
                        const paramRows = Math.ceil(params.length/cols4);
                        y += paramRows*boxH + 5;

                        // ════════════════════════════════
                        // TABLA COMPOSICIÓN
                        // ════════════════════════════════
                        // Cabecera sección
                        setFill('#059669'); doc.rect(ML, y, 2.5, 5, 'F');
                        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); setTxt('#374151');
                        doc.text('COMPOSICIÓN DE FIBRAS Y CONSUMO POR DOCENA', ML+4.5, y+3.5);
                        y += 7;

                        // Anchos de columna
                        const cols = [32, 30, 22, 14, 20, 42, 26];
                        const heads = ['FIBRA','TÍTULO','LOTE','PART.%','CONS.(g)','TORSIÓN / ÍTEM','COSTO/DOC'];
                        const thH = 6;

                        // Header tabla
                        setFill('#1f2937'); doc.rect(ML, y, CW, thH, 'F');
                        let cx = ML;
                        heads.forEach((h,hi) => {
                            doc.setFont('helvetica','bold'); doc.setFontSize(5.5); setTxt('#ffffff');
                            const align = hi>=3 ? 'center' : 'left';
                            const tx = align==='center' ? cx+cols[hi]/2 : cx+2;
                            doc.text(h, tx, y+4, {align});
                            cx += cols[hi];
                        });
                        y += thH;

                        // Filas fibras
                        s.fibras.forEach((f, fi) => {
                            const gr = dW*(f.porcentaje/100);
                            const cost = (gr/1000)*(parseFloat(f.costoKg)||0);
                            const rigid = isRigid(f);
                            const rowH = 7;
                            const rowBg = fi%2===0 ? '#ffffff' : '#f8fafc';
                            setFill(rowBg); setDraw('#e5e7eb'); doc.setLineWidth(0.1);
                            doc.rect(ML, y, CW, rowH, 'FD');

                            cx = ML;
                            const cells = [
                                {v:f.nombre||'—', b:true, al:'left'},
                                {v:f.titulo||'—', b:false, al:'left'},
                                {v:f.lote||'—', b:false, al:'left', sz:6},
                                {v:`${f.porcentaje}%`, b:true, al:'center', col:f.porcentaje>0?'#059669':'#dc2626'},
                                {v:gr.toFixed(1), b:true, al:'center'},
                                {v: rigid
                                    ? `[RÍG] ${f.itemS||'—'}`
                                    : `[S] ${f.itemS||'—'}   [Z] ${f.itemZ||'—'}`,
                                  b:false, al:'left', sz:6},
                                {v:`$${cost.toFixed(2)}`, b:true, al:'right', col:'#059669'},
                            ];
                            cells.forEach((c,ci) => {
                                doc.setFont('helvetica', c.b?'bold':'normal');
                                doc.setFontSize(c.sz||7); setTxt(c.col||'#111111');
                                const tx = c.al==='center' ? cx+cols[ci]/2 : c.al==='right' ? cx+cols[ci]-2 : cx+2;
                                doc.text(String(c.v), tx, y+rowH/2+1.2, {align:c.al});
                                cx += cols[ci];
                            });
                            y += rowH;
                        });

                        // Fila totales
                        const totH = 8;
                        setFill('#f0fdf4'); setDraw('#059669'); doc.setLineWidth(0.5);
                        doc.rect(ML, y, CW, totH, 'FD');
                        doc.setLineWidth(0.1);
                        // "TOTALES" label
                        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); setTxt('#374151');
                        doc.text('TOTALES', ML+cols[0]+cols[1]+cols[2]-2, y+totH/2+1.2, {align:'right'});
                        // Pct total
                        const pctOk = totalPct===100;
                        doc.setFontSize(9); setTxt(pctOk?'#059669':'#dc2626');
                        doc.text(`${totalPct}%`, ML+cols[0]+cols[1]+cols[2]+cols[3]/2, y+totH/2+1.8, {align:'center'});
                        // Peso docena
                        doc.setFontSize(7); setTxt('#111111');
                        doc.text(dW.toFixed(1), ML+cols[0]+cols[1]+cols[2]+cols[3]+cols[4]/2, y+totH/2+1.2, {align:'center'});
                        // Costo total
                        doc.setFontSize(10); setTxt('#059669');
                        doc.text(`$${totalCost.toFixed(2)}`, ML+CW-2, y+totH/2+1.8, {align:'right'});
                        y += totH + 5;

                        // ════════════════════════════════
                        // PANEL INFERIOR: costo + torsiones
                        // ════════════════════════════════
                        // Box costo total
                        setFill('#f0fdf4'); setDraw('#86efac'); doc.setLineWidth(0.3);
                        doc.roundedRect(ML, y, 45, 18, 2,2,'FD');
                        doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#6b7280');
                        doc.text('COSTO MP / DOCENA', ML+3, y+5);
                        doc.setFontSize(15); setTxt('#059669');
                        doc.text(`$${totalCost.toFixed(2)}`, ML+3, y+13);
                        doc.setFontSize(6.5); setTxt('#6b7280');
                        doc.text(`USD · ${tubos} tubos`, ML+3, y+17);

                        // Desglose torsiones al lado
                        let tx2 = ML+48, ty2 = y;
                        doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#6b7280');
                        doc.text('DESGLOSE TORSIÓN S / Z POR FIBRA', tx2, ty2+4);
                        ty2 += 6;
                        let txc = tx2, tyc = ty2;
                        s.fibras.forEach((f, fi) => {
                            const gr = dW*(f.porcentaje/100);
                            const rigid = isRigid(f);
                            const lbl = f.titulo || f.nombre;
                            const bw = 60, bh = 8;
                            if (txc + bw > PW-MR) { txc = tx2; tyc += bh+2; }
                            setFill('#f8fafc'); setDraw('#e2e8f0'); doc.setLineWidth(0.2);
                            doc.roundedRect(txc, tyc, bw, bh, 1,1,'FD');
                            doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#111111');
                            doc.text(lbl.length>14?lbl.slice(0,14)+'…':lbl, txc+2, tyc+5);
                            if (rigid) {
                                setFill('#dcfce7'); doc.roundedRect(txc+bw-28, tyc+1.5, 9,4,1,1,'F');
                                doc.setFontSize(5); setTxt('#166534'); doc.text('RÍG', txc+bw-23.5, tyc+4.5, {align:'center'});
                                doc.setFontSize(6); setTxt('#059669'); doc.text(`${gr.toFixed(1)}g`, txc+bw-18, tyc+5);
                            } else {
                                setFill('#dbeafe'); doc.roundedRect(txc+bw-26, tyc+1.5, 6,4,1,1,'F');
                                doc.setFontSize(5); setTxt('#1e40af'); doc.text('S', txc+bw-23, tyc+4.5,{align:'center'});
                                doc.setFontSize(6); setTxt('#374151'); doc.text(`${(gr/2).toFixed(1)}g`, txc+bw-19, tyc+5);
                                setFill('#f3f4f6'); doc.roundedRect(txc+bw-12, tyc+1.5, 6,4,1,1,'F');
                                doc.setFontSize(5); setTxt('#374151'); doc.text('Z', txc+bw-9, tyc+4.5,{align:'center'});
                                doc.setFontSize(6); doc.text(`${(gr/2).toFixed(1)}g`, txc+bw-5, tyc+5);
                            }
                            txc += bw+3;
                        });
                        y += 22;

                        // ════════════════════════════════
                        // OBSERVACIONES (si las hay)
                        // ════════════════════════════════
                        if (s.observaciones && s.observaciones.trim()) {
                            y += 3;
                            setFill('#fffbeb'); setDraw('#fcd34d'); doc.setLineWidth(0.3);
                            doc.roundedRect(ML, y, CW, 14, 2,2,'FD');
                            doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#92400e');
                            doc.text('OBSERVACIONES', ML+3, y+4.5);
                            doc.setFont('helvetica','normal'); doc.setFontSize(7); setTxt('#374151');
                            const lines = doc.splitTextToSize(s.observaciones, CW-6);
                            doc.text(lines.slice(0,2), ML+3, y+9);
                            y += 17;
                        }

                        // ════════════════════════════════
                        // FOOTER
                        // ════════════════════════════════
                        const footerY = PH-10;
                        setDraw('#e5e7eb'); doc.setLineWidth(0.3);
                        doc.line(ML, footerY, PW-MR, footerY);
                        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); setTxt('#9ca3af');

                                B(7.5,'#3b82f6'); doc.text(mr['__diam__']||'—',ML+18,y+5.5);
                                rP.forEach((parte,pi2)=>{

                                    ['min','prom','max'].forEach((l,li)=>{

                                        doc.text(v.length>max?v.slice(0,max-1)+'…':v, cx, y+5.5, {align:'center'});

                                });
                                y+=8;
                            });
                            y+=4;
                        }

                        /* ══ 3. MEDIDAS EN CRUDO ══ */
                        if(ft.medidasCrudo&&Object.keys(ft.medidasCrudo).length>0){
                            y=checkPage(y,20);
                            sf('#14532d'); doc.rect(ML,y,CW,7,'F');
                            sf('#16a34a'); doc.rect(ML,y,3,7,'F');

                            const aC=(ft.anchosActivos||[]).concat(ft.anchoExtra?[ft.anchoExtra]:[]);
                            const lC=(ft.largosActivos||[]).concat(ft.largoExtra?[ft.largoExtra]:[]);
                            const allC=[].concat(aC,lC);
                            if(allC.length>0){
                                const lblW=36;
                                /* Give each col enough width for notes — min 28mm */
                                const colW=Math.max(28,(CW-lblW)/allC.length);
                                /* Group headers */
                                sf('#1e3a5f'); doc.rect(ML+lblW,y,aC.length*colW,5.5,'F');
                                sf('#064e3b'); doc.rect(ML+lblW+aC.length*colW,y,lC.length*colW,5.5,'F');
                                B(7,'#93c5fd'); doc.text('ANCHOS (cm)',ML+lblW+aC.length*colW/2,y+3.8,{align:'center'});
                                B(7,'#6ee7b7'); doc.text('LARGOS (cm)',ML+lblW+aC.length*colW+lC.length*colW/2,y+3.8,{align:'center'});
                                y+=5.5;
                                /* Col name headers */
                                sf('#1f2937'); doc.rect(ML,y,CW,6.5,'F');
                                B(6,'#9ca3af');
                                doc.text('TALLA',ML+2,y+4.5); doc.text('LÍM.',ML+16,y+4.5); doc.text('DIÁM.',ML+26,y+4.5);
                                allC.forEach((col,ci)=>{
                                    B(6.5,ci<aC.length?'#93c5fd':'#6ee7b7');
                                    const t=col.length>12?col.slice(0,11)+'…':col;
                                    doc.text(t,ML+lblW+ci*colW+colW/2,y+4.5,{align:'center'});
                                });
                                y+=6.5;
                                Object.keys(ft.medidasCrudo).forEach(talla=>{
                                    y=checkPage(y,20);
                                    const mc=ft.medidasCrudo[talla]||{};
                                    const diam=mc['__diam__']||'';
                                    const rowH=8;
                                    ['min','prom','max'].forEach((lim,li)=>{
                                        const isE=lim!=='prom';
                                        sf(isE?'#1a0a0a':'#111827'); doc.rect(ML,y,CW,rowH,'F');
                                        if(li===0){ B(9,'#f1f5f9'); doc.text(talla,ML+2,y+5.5); B(7,'#3b82f6'); doc.text(diam,ML+26,y+5.5); }
                                        if(isE) B(7,'#ef4444'); else B(7,'#9ca3af');
                                        doc.text(lim.toUpperCase(),ML+16,y+5.5);
                                        allC.forEach((col,ci)=>{
                                            const v=String(((mc[lim]||{})[col])||'');
                                            /* Wide cell — show full note text */
                                            const max=Math.floor(colW/2.05);
                                            if(isE) B(7.5,'#ef4444'); else N(7.5,'#e2e8f0');
                                            const disp=v.length>max?v.slice(0,max-1)+'…':v;
                                            doc.text(disp,ML+lblW+ci*colW+colW/2,y+5.5,{align:'center'});
                                        });
                                        y+=rowH;
                                    });
                                    sd('#14532d'); doc.setLineWidth(0.4); doc.line(ML,y,ML+CW,y); doc.setLineWidth(0.1);
                                    y+=1;
                                });
                                y+=4;
                            }
                        }

                        /* ══ APROBACIONES ══ */
                        y=checkPage(y,38);
                        sf('#4c1d95'); doc.rect(ML,y,CW,7,'F');
                        sf('#7c3aed'); doc.rect(ML,y,3,7,'F');
                        B(9,'#ede9fe'); doc.text('APROBACIÓN Y LIBERACIÓN A PRODUCCIÓN', ML+5, y+5);
                        y+=9;
                        const aprobDefs=[
                            {k:'aproboArmado',    l:'ARMADO Y CALIDAD', col:'#3b82f6'},
                            {k:'aproboCorseteria',l:'CORSETERÍA',        col:'#10b981'},
                            {k:'aproboCalidad',   l:'CALIDAD',           col:'#f59e0b'},
                            {k:'aproboDiseno',    l:'DISEÑO',            col:'#ec4899'},
                        ];
                        const bw=(CW-9)/4;
                        aprobDefs.forEach((item,ai)=>{
                            const apr=ft[item.k]||{};
                            const bx=ML+ai*(bw+3);
                            const[cr,cg,cb]=h2r(item.col);
                            sf('#0d1520'); doc.roundedRect(bx,y,bw,26,2,2,'F');
                            doc.setDrawColor(cr,cg,cb); doc.setLineWidth(1.2);
                            doc.roundedRect(bx,y,bw,26,2,2,'D'); doc.setLineWidth(0.2);
                            B(6.5,item.col); doc.text(item.l,bx+bw/2,y+5,{align:'center'});
                            if(apr.bloqueado){
                                doc.setFillColor(cr,cg,cb); doc.roundedRect(bx+2,y+7,bw-4,9,1.5,1.5,'F');
                                B(7.5,'#ffffff'); doc.text('✓ '+apr.nombre,bx+bw/2,y+12,{align:'center'});
                                N(5.5,'#ffffffcc'); doc.text(apr.fecha||'',bx+bw/2,y+18,{align:'center'});
                            } else {
                                sd('#374151'); doc.setLineWidth(0.35); doc.line(bx+4,y+19,bx+bw-4,y+19); doc.setLineWidth(0.1);
                                N(6,'#6b7280'); doc.text('PENDIENTE',bx+bw/2,y+23.5,{align:'center'});
                            }
                        });
                        y+=30;
                        const allAppr=aprobDefs.every(item=>(ft[item.k]||{}).bloqueado);
                        if(allAppr){
                            sf('#065f46'); doc.rect(ML,y,CW,8,'F');
                            B(10,'#6ee7b7'); doc.text('✓  PRODUCTO LIBERADO A PRODUCCIÓN',ML+CW/2,y+5.5,{align:'center'});
                            y+=11;
                        }
                        if(ft.fechaAprobacion||ft.observacionesGenerales){
                            sf('#0d1520'); doc.rect(ML,y,CW,ft.observacionesGenerales?18:7,'F');
                            B(7,'#9ca3af'); doc.text('Fecha Aprobación:',ML+3,y+5);
                            N(7,'#f1f5f9'); doc.text(ft.fechaAprobacion||'—',ML+38,y+5);
                            if(ft.observacionesGenerales){
                                B(7,'#9ca3af'); doc.text('Obs:',ML+3,y+11);
                                N(7,'#e2e8f0');
                                const obs=doc.splitTextToSize(ft.observacionesGenerales,CW-20);
                                doc.text(obs.slice(0,2),ML+16,y+11);
                            }
                            y+=ft.observacionesGenerales?21:10;
                        }
                        footerLine(doc.getNumberOfPages(),'?');
                    });

                    /* Fix page numbers */
                    const total=doc.getNumberOfPages();
                    for(let p=1;p<=total;p++){
                        doc.setPage(p);
                        /* re-write total in footer — overwrite '?' with actual total */
                        const pgW=doc.internal.pageSize.getWidth();
                        const pgH=doc.internal.pageSize.getHeight();
                        sf('#0a0e1a'); doc.rect(pgW-25,pgH-9,25,6,'F');
                        N(5.5,'#4b5563');
                        doc.text(fecha+'  ·  Pág '+p+'/'+total, pgW-(pgW===297?LMR:MR), pgH-5.5, {align:'right'});
                    }

                    const fname='Swantex_Guia_Operarios_'+new Date().toLocaleDateString('es-CO').replace(/\//g,'-')+'.pdf';
                    doc.save(fname);
                } catch(err) {
                    console.error(err);
                    alert('Error PDF Operarios: '+err.message);
                } finally { setIsExporting(false); }
            }, 50);
        };


        /* ══════════════════════════════════════
           ENHEBRADO TAB — FT-CIR-004
        ══════════════════════════════════════ */

        // Colores por tipo de hilo (para las pastillas)
        const HILO_COLORS = {
            'Nylon Tex':  { bg:'#1e3a5f', border:'#3b82f6', text:'#93c5fd', dot:'#3b82f6' },
            'Nylon Rig':  { bg:'#2e1a5f', border:'#8b5cf6', text:'#c4b5fd', dot:'#8b5cf6' },
            'Lycra':      { bg:'#064e3b', border:'#10b981', text:'#6ee7b7', dot:'#10b981' },
            'Poliester':  { bg:'#451a03', border:'#f59e0b', text:'#fcd34d', dot:'#f59e0b' },
            'Jaspe':      { bg:'#450a0a', border:'#ef4444', text:'#fca5a5', dot:'#ef4444' },
        };
        const getHiloColor = (nombre) => HILO_COLORS[nombre] || { bg:'#1f2937', border:'#374151', text:'#9ca3af', dot:'#6b7280' };

                /* ══════════════════════════════════════
           RENDER PRINCIPAL (con pestañas)
        ══════════════════════════════════════ */
        return (
            <div style={{minHeight:'100vh', padding:'20px 16px 60px', maxWidth:1400, margin:'0 auto'}}>
                {/* ── HEADER ── */}
                <header style={{marginBottom:20, display:'flex', flexWrap:'wrap', gap:16, alignItems:'center', justifyContent:'space-between'}}>
                    <div>
                        <div style={{display:'flex', alignItems:'baseline', gap:10}}>
                            <h1 style={{fontSize:26, fontWeight:900, letterSpacing:'-0.04em', margin:0, color:'#f1f5f9'}}>
                                TEXTILES <span style={{color:'#10b981'}}>SWANTEX</span>
                            </h1>
                            <span style={{fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.1em'}}>SAS</span>
                        </div>
                        <p style={{margin:'2px 0 0', fontSize:10, fontWeight:700, color:'#374151', textTransform:'uppercase', letterSpacing:'0.12em'}}>
                            Sistema de Ingeniería Textil · v7
                        </p>
                    </div>
                    <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
                        <button className="btn btn-dark" onClick={() => fileInputRef.current.click()}><Ico.Upload/> Importar</button>
                        <input type="file" ref={fileInputRef} onChange={importBackup} style={{display:'none'}} accept=".json"/>
                        <button className="btn btn-dark" onClick={exportBackup}><Ico.Save/> Backup</button>
                        <button className="btn btn-dark" onClick={exportExcel}><Ico.Excel/> Excel</button>
                        <button className="btn btn-blue" onClick={downloadPdf} disabled={isExporting}
                            title="PDF de Precosteos — para Ingeniería"
                            style={{display: activeTab==='precosteos' ? 'inline-flex' : 'none'}}>
                            <Ico.Pdf/> {isExporting ? 'Generando…' : 'PDF Precosteos'}
                        </button>
                        <button
                            onClick={downloadPdfOperarios} disabled={isExporting}
                            title="PDF Ficha Técnica completa — para Operarios en planta"
                            style={{
                                display: activeTab==='ftcir004' ? 'inline-flex' : 'none',
                                padding:'9px 16px', borderRadius:10, fontWeight:700,
                                fontSize:12, cursor:'pointer', border:'none',
                                alignItems:'center', gap:6,
                                background:'#7c3aed', color:'#fff',
                                textTransform:'uppercase', letterSpacing:'0.04em',
                                whiteSpace:'nowrap'
                            }}>
                            <Ico.Pdf/> {isExporting ? 'Generando…' : 'PDF Operarios'}
                        </button>
                        {activeTab === 'precosteos' && (
                            <button className="btn btn-emerald" onClick={createNew}><Ico.Plus/> Nueva Ficha</button>
                        )}
                    </div>
                </header>

                {/* ── PESTAÑAS ── */}
                <div style={{display:'flex', gap:4, marginBottom:24, borderBottom:'2px solid #1f2937', paddingBottom:0}}>
                    {[
                        { id:'precosteos', label:'F-CIR-002', sub:'Precosteos' },
                        { id:'ftcir004',   label:'FT-CIR-004', sub:'Medidas' },
                        { id:'enhebrado',  label:'FT-CIR-005', sub:'Enhebrado' },
                    ].map(tab => (
                        <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                            style={{
                                padding:'10px 22px 12px', border:'none', cursor:'pointer', borderRadius:'10px 10px 0 0',
                                background: activeTab===tab.id ? '#111827' : 'transparent',
                                borderBottom: activeTab===tab.id ? '2px solid #10b981' : '2px solid transparent',
                                marginBottom:-2, transition:'all 0.15s',
                                display:'flex', flexDirection:'column', alignItems:'center', gap:1,
                            }}>
                            <span style={{fontSize:10, fontWeight:900, color: activeTab===tab.id ? '#10b981' : '#4b5563',
                                textTransform:'uppercase', letterSpacing:'0.1em'}}>{tab.label}</span>
                            <span style={{fontSize:12, fontWeight:700, color: activeTab===tab.id ? '#f1f5f9' : '#6b7280'}}>{tab.sub}</span>
                        </button>
                    ))}
                </div>

                {/* ── CONTENIDO PESTAÑAS ── */}
                {activeTab === 'precosteos' && (
                    <div>
                        {/* Dashboard */}
                        <section style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:12, marginBottom:24}}>
                            {[
                                { label:'Costo Consolidado', val:`$${globalSummary.totalCost.toFixed(2)}`, sub:'USD / Docena', color:'#10b981' },
                                { label:'Consumo MP Total',  val:`${globalSummary.totalKg.toFixed(3)}`,   sub:'Kilogramos',   color:'#3b82f6' },
                                { label:'Referencias',       val:globalSummary.count,                     sub:'Fichas activas', color:'#8b5cf6' },
                                { label:'Aprobadas',         val:structures.filter(s=>s.status==='APROBADO').length, sub:'En producción', color:'#f59e0b' },
                            ].map((c,i) => (
                                <div key={i} className="stat-card">
                                    <p style={{fontSize:10, fontWeight:800, color:c.color, textTransform:'uppercase', letterSpacing:'0.1em', margin:'0 0 8px'}}>{c.label}</p>
                                    <p className="mono" style={{fontSize:26, fontWeight:700, margin:'0 0 2px', color:'#f1f5f9'}}>{c.val}</p>
                                    <p style={{fontSize:10, color:'#4b5563', margin:0, textTransform:'uppercase', fontWeight:600}}>{c.sub}</p>
                                </div>
                            ))}
                        </section>

                        {/* Filtros */}
                        <div style={{display:'flex', gap:10, marginBottom:20, flexWrap:'wrap', alignItems:'center'}}>
                            <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}
                                placeholder="Buscar por prenda, referencia, fibra…"
                                style={{maxWidth:280, background:'#0d1520', border:'1px solid #2a3a50', color:'#e2e8f0'}}/>
                            {['TODOS','PENDIENTE','REVISIÓN','APROBADO'].map(st => (
                                <button key={st} onClick={()=>setFilterStatus(st)}
                                    style={{padding:'6px 14px', borderRadius:8, fontSize:11, fontWeight:700, cursor:'pointer',
                                        background: filterStatus===st?'#10b981':'#1f2937',
                                        color: filterStatus===st?'#fff':'#6b7280',
                                        border: filterStatus===st?'1px solid #059669':'1px solid #374151',
                                        textTransform:'uppercase', letterSpacing:'0.06em'}}>{st}</button>
                            ))}
                            <span style={{fontSize:11, color:'#4b5563', marginLeft:'auto'}}>
                                {visibleStructures.length} de {structures.length} fichas
                            </span>
                        </div>

                        {/* Lista fichas */}
                        <div ref={printRef} style={{display:'flex', flexDirection:'column', gap:24}}>
                            {visibleStructures.length === 0 && (
                                <div style={{textAlign:'center', padding:'60px 20px', background:'#111827',
                                    borderRadius:20, border:'2px dashed #1f2937'}}>
                                    <p style={{color:'#374151', fontWeight:700, fontSize:16, textTransform:'uppercase'}}>
                                        {searchQuery||filterStatus!=='TODOS' ? 'Sin resultados' : 'No hay fichas técnicas'}
                                    </p>
                                    {!searchQuery && filterStatus==='TODOS' && (
                                        <button className="btn btn-emerald" style={{marginTop:16}} onClick={createNew}>
                                            <Ico.Plus/> Crear primera ficha
                                        </button>
                                    )}
                                </div>
                            )}
                            {visibleStructures.map((s, idx) => (
                                <FichaCard key={s.id} s={s} idx={idx}
                                    isExpanded={expandedId===s.id || visibleStructures.length===1}
                                    onToggle={()=>setExpandedId(prev=>prev===s.id?null:s.id)}
                                    onUpdate={updateField} onMachineChange={handleMachineChange}
                                    onFibraUpdate={updateFibra} onFibraRemove={removeFibra}
                                    onDelete={deleteStructure}
                                    realIdx={structures.findIndex(x=>x.id===s.id)}
                                />
                            ))}
                        </div>
                    </div>
                )}

                {activeTab === 'ftcir004' && (
                    <FT004Tab structures={structures} />
                )}

                {activeTab === 'enhebrado' && (
                    <EnhebradoTab structures={structures} />
                )}
            </div>
        );
    };

    /* ══════════════════════════════════════════
       COMPONENTE FICHA CARD
    ══════════════════════════════════════════ */
    const FichaCard = ({ s, idx, realIdx, isExpanded, onToggle, onUpdate, onMachineChange, onFibraUpdate, onFibraRemove, onDelete }) => {
        const tubos = parseInt(s.header.tubosPorDocena)||12;
        const dW = (parseFloat(s.specs.pesoUnitarioGramos)||0) * tubos;
        const totalPct = s.fibras.reduce((a,f)=>a+(f.porcentaje||0), 0);
        const totalCost = s.fibras.reduce((acc,f) => {
            const gr = dW*(f.porcentaje/100);
            return acc + (gr/1000)*(parseFloat(f.costoKg)||0);
        }, 0);

        // ── Estado del asistente de composición ─────────────────────
        const [respAsistente, setRespAsistente] = useState({});
        const [asistenteListo, setAsistenteListo] = useState(false);

        const tieneSpandex   = s.fibras.some(f=>esSpandexDesnudo(f.nombre,f.titulo));
        const tieneBodyFresh = s.fibras.some(f=>esBodyFresh(f));
        const necesita       = necesitaAsistente(s.fibras);
        // Si no necesita asistente, siempre listo
        const puedeCalcular  = !necesita || asistenteListo;

        const respFinal = {
            spandexPct:   (respAsistente.spandexPct != null ? respAsistente.spandexPct : (tieneSpandex ? 1 : 0)),
            bodyFreshPct: (respAsistente.bodyFreshPct != null ? respAsistente.bodyFreshPct : (tieneBodyFresh ? 5 : 0)),
        };

        // Recalcular cuando cambian fibras o respuestas
        const composicionSugerida = useMemo(()=>
            calcularComposicionSugerida(s.fibras, s.header.alimentadores||8, puedeCalcular ? respFinal : undefined),
            [s.id, s.updatedAt, s.header.alimentadores, puedeCalcular, JSON.stringify(respAsistente)]
        );
        const getSugerido = (fi) => { const s2=composicionSugerida.find(x=>x.idx===fi); return s2?s2.porcentaje:null; };

        const aplicarTodas = () => {
            composicionSugerida.forEach(sg=>{
                if(sg.porcentaje>0) onFibraUpdate(s.id, sg.idx, 'porcentaje', sg.porcentaje);
            });
        };

        // Texto etiqueta ICONTEC
        const textoEtiqueta = (() => {
            const items = s.fibras
                .filter(f=>f.porcentaje>0 && f.titulo)
                .sort((a,b)=>b.porcentaje-a.porcentaje)
                .map(f=>`${f.porcentaje}% ${NOMBRE_ETIQUETA[f.nombre]||f.nombre}`);
            return items.join(' / ');
        })();

        const cycleSeconds = (parseInt(s.specs.tiempoMin)||0)*60 + (parseInt(s.specs.tiempoSeg)||0);
        const docsPerDay = cycleSeconds > 0 ? Math.floor(86400/cycleSeconds/tubos) : 0;

        const statusColors = { 'PENDIENTE':'#f59e0b', 'REVISIÓN':'#3b82f6', 'APROBADO':'#10b981' };
        const sColor = statusColors[s.status] || '#6b7280';

        return (
            <div className="card card-hover fade-in" style={{border:`1px solid #1f2937`}}>
                {/* ── Cabecera Ficha ── */}
                <div style={{
                    background:'linear-gradient(135deg, #0d1520 0%, #111827 100%)',
                    padding:'20px 24px', display:'flex', flexWrap:'wrap', gap:16,
                    alignItems:'center', justifyContent:'space-between',
                    borderBottom:'1px solid #1f2937'
                }}>
                    <div style={{flex:1, minWidth:220}}>
                        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:8}}>
                            <span style={{
                                background:'#10b981', color:'#fff', width:28, height:28,
                                borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center',
                                fontSize:11, fontWeight:900
                            }}>#{realIdx+1}</span>
                            <span style={{fontSize:10, color:'#4b5563', fontWeight:800, textTransform:'uppercase', letterSpacing:'0.12em'}}>
                                {s.id}
                            </span>
                            <span style={{
                                padding:'3px 10px', borderRadius:99, fontSize:10, fontWeight:800,
                                textTransform:'uppercase', letterSpacing:'0.08em',
                                background: sColor+'20', color: sColor, border:`1px solid ${sColor}40`
                            }}>{s.status}</span>
                        </div>
                        <input
                            value={s.nombrePrenda}
                            onChange={e => onUpdate(s.id,'nombrePrenda',e.target.value)}
                            style={{
                                background:'transparent', border:'none', color:'#f1f5f9',
                                fontSize:22, fontWeight:900, letterSpacing:'-0.03em',
                                padding:0, width:'100%', textTransform:'uppercase'
                            }}
                        />
                    </div>
                    <div style={{display:'flex', gap:10, alignItems:'center'}} className="no-print">
                        <select value={s.status} onChange={e=>onUpdate(s.id,'status',e.target.value)}
                            style={{background:'#1f2937', border:'1px solid #374151', color:'#e2e8f0',
                                borderRadius:8, padding:'7px 12px', fontSize:11, fontWeight:700,
                                textTransform:'uppercase', cursor:'pointer'}}>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="REVISIÓN">Revisión</option>
                            <option value="APROBADO">Aprobado</option>
                        </select>
                        <button className="btn btn-dark" onClick={onToggle} style={{padding:'8px 14px'}}>
                            {isExpanded ? '▲ Cerrar' : '▼ Expandir'}
                        </button>
                        <button className="btn btn-red" style={{padding:'8px 10px'}} onClick={()=>onDelete(s.id)}
                            title="Eliminar ficha"><Ico.Trash/></button>
                    </div>
                    {/* Mini resumen siempre visible */}
                    <div style={{
                        width:'100%', display:'flex', gap:20, paddingTop:12,
                        borderTop:'1px solid #1f2937', flexWrap:'wrap'
                    }}>

                            { label:'Referencia', val:s.header.referencia||'—' },
                            { label:'Talla', val:s.header.talla },

                            { label:'Peso Unit.', val:`${s.specs.pesoUnitarioGramos||0}g` },

                        <div style={{display:'grid', gridTemplateColumns:'280px 1fr', gap:24, alignItems:'start'}}>
