function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},2300);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function pad(n){return ('0'+n).slice(-2);}
function hoy(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmt(f){var p=(f||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:f||'';}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function dig(s){return String(s||'').replace(/\D/g,'');}
function ini(n){var w=String(n||'?').trim().split(/\s+/);return ((w[0]||'?')[0]+(w[1]||'')[0]).toUpperCase();}
function dimes(m){var p=m.split('-');return new Date(+p[0],+p[1],0).getDate();}
function ds(m,d){return m+'-'+pad(d);}
function mins(date,hm){var a=date.split('-'),b=hm.split(':');return Math.floor(new Date(+a[0],+a[1]-1,+a[2],+b[0],+b[1]).getTime()/60000);}
function minsDate(date,h){var a=date.split('-');return Math.floor(new Date(+a[0],+a[1]-1,+a[2],0,0).getTime()/60000)+Math.round(h*60);}
function hm(m){var d=new Date(m*60000);return pad(d.getHours())+':'+pad(d.getMinutes());}
function prevMes(m){var a=m.split('-');var d=new Date(+a[0],+a[1]-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function nextMes(m){var a=m.split('-');var d=new Date(+a[0],+a[1],1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function hh(x){return (x/60).toFixed(1).replace('.0','');}

/* ---------- acceso ---------- */
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('swx-rh|'+t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
function boot(){
  mes=hoy().slice(0,7);
  try{firebase.initializeApp(CFG);db=firebase.firestore();col=db.collection('fichas');}catch(e){}
  if(!col){$('lock').style.display='block';$('lock').innerHTML='Sin conexión a la base de datos.';return;}
  var ok=false;try{ok=sessionStorage.getItem('rh_ok')==='1';}catch(e){}
  col.doc('RH-CONFIG').get().then(function(d){
    var h=d.exists&&d.data().pin;
    if(ok&&h){entrar();return;}
    var L=$('lock');L.style.display='block';
    L.innerHTML='<h2>🔒 Personal</h2><div class="muted">'+(h?'Escribe la clave de acceso':'Primera vez: crea una clave (mínimo 4 caracteres)')+'</div><input type="password" id="pin" autofocus><button class="btn" style="width:100%" id="pinb">Entrar</button><div class="muted" id="pinm" style="margin-top:8px"></div>';
    var go=function(){var v=$('pin').value;if(v.length<4){$('pinm').textContent='Mínimo 4 caracteres';return;}
      sha(v).then(function(x){
        if(!h){col.doc('RH-CONFIG').set({tipo:'rh_cfg',pin:x}).then(function(){try{sessionStorage.setItem('rh_ok','1');}catch(e){}entrar();});}
        else if(x===h){try{sessionStorage.setItem('rh_ok','1');}catch(e){}entrar();}
        else $('pinm').textContent='Clave incorrecta';});};
    $('pinb').onclick=go;$('pin').onkeydown=function(e){if(e.key==='Enter')go();};
  }).catch(function(){$('lock').style.display='block';$('lock').innerHTML='No se pudo conectar. Revisa internet.';});
}
function entrar(){
  $('lock').style.display='none';$('app').style.display='block';
  col.where('tipo','==','rh_persona').onSnapshot(function(s){P={};s.forEach(function(d){var x=d.data();x.id=d.id;P[d.id]=x;});net(true);draw();},function(){net(false);});
  col.where('tipo','==','rh_nov').onSnapshot(function(s){NOV=[];s.forEach(function(d){var x=d.data();x.id=d.id;NOV.push(x);});draw();});
  col.where('tipo','==','rh_turnos').onSnapshot(function(s){TU={};s.forEach(function(d){var x=d.data();TU[x.mes]=x.a||{};});draw();});
  col.where('tipo','==','rh_marc').onSnapshot(function(s){MA={};s.forEach(function(d){var x=d.data();MA[x.mes]=x.m||{};});draw();});
  col.where('tipo','==','rh_cob').onSnapshot(function(s){COB=[];s.forEach(function(d){var r=d.data().r||{};Object.keys(r).forEach(function(k){COB.push(r[k]);});});draw();});
  col.where('tipo','==','rh_arch').onSnapshot(function(s){ARCH=[];s.forEach(function(d){var x=d.data();x.id=d.id;ARCH.push(x);});draw();Array.prototype.forEach.call(document.querySelectorAll('.ab'),function(e){e.innerHTML=archInner(e.getAttribute('data-o'));});});
  draw();
}
function net(ok){$('net').textContent=ok?'● En línea · '+Object.keys(P).length+' personas':'○ Sin conexión';}

/* ---------- vistas ---------- */
function draw(){
  if(!$('app')||$('app').style.display==='none')return;
  var T=[['personal','👥 Personal'],['turnos','📅 Turnos'],['nov','📝 Novedades'],['cot','⏱ Timbradas y horas'],['arch','📎 Archivos']];
  $('tabs').innerHTML=T.map(function(t){return '<button class="tab'+(tab===t[0]?' on':'')+'" onclick="tab=\''+t[0]+'\';draw()">'+t[1]+'</button>';}).join('');
  var a=document.activeElement; if(a&&(a.id==='fp'||a.id==='fcot')){}
  var h='';
  if(tab==='personal')h=vPersonal();else if(tab==='turnos')h=vTurnos();else if(tab==='nov')h=vNov();else if(tab==='cot')h=vCot();else h=vArch();
  var keep=(document.activeElement&&document.activeElement.id)||'';var pos=0;
  if(keep){try{pos=document.activeElement.selectionStart;}catch(e){}}
  $('main').innerHTML=h;
  if(keep&&$(keep)){$(keep).focus();try{$(keep).setSelectionRange(pos,pos);}catch(e){}}
}
function mesBar(extra){return '<div class="bar"><b>Mes:</b><input type="month" value="'+mes+'" onchange="mes=this.value;draw()">'+(extra||'')+'</div>';}
function pList(soloAct){return Object.keys(P).map(function(k){return P[k];}).filter(function(p){return !soloAct||p.activo!==false;}).sort(function(a,b){return (a.nombre||'').localeCompare(b.nombre||'');});}
function avatar(p){return '<div class="av">'+(p.foto?'<img src="'+p.foto+'">':esc(ini(p.nombre)))+'</div>';}

/* PERSONAL */
function vPersonal(){
  var q=norm(fPers);
  var l=pList(false).filter(function(p){return !q||norm(p.nombre+' '+p.cedula+' '+p.cargo+' '+p.equipo).indexOf(q)>=0;});

  h+='<div class="grid">'+l.map(function(p){return '<button class="pc'+(p.activo===false?' off':'')+'" onclick="verP(\''+p.id+'\')">'+avatar(p)+'<div><b>'+esc(p.nombre)+'</b><small>'+esc(p.cargo||'Operario')+(p.equipo?' · '+esc(p.equipo):'')+'</small>'+(p.activo===false?'<small>Retirado</small>':'')+'</div></button>';}).join('')+'</div>';
  if(!l.length)h+='<div class="card muted">Aún no hay personas. Usa “Traer operarios del sistema” para empezar con los que ya existen.</div>';
  return h;
}

function aplicarLista(){
  if(!confirm('Se va a cargar la pauta de horario de la lista del 19 de octubre en las '+LISTA.length+' personas (cargo, equipo, turno y horarios). ¿Seguir?'))return;
  var bt=db.batch(),n=0,falt=[];
  LISTA.forEach(function(L){
    var p=(L.c&&buscaP(L.c))||buscaP(L.n);
    var id=p?p.id:'RH-P-'+uid();
    if(!p)falt.push(L.n);
    bt.set(col.doc(id),{tipo:'rh_persona',nombre:p?p.nombre:L.n,cedula:(p&&p.cedula)||L.c,cargo:L.g,equipo:L.e,activo:true,
      rot:L.r,grp:L.gr||'A',alm:L.a,d:L.d,n:L.x,ts:Date.now()},{merge:true});
    n++;
  });

/* TURNOS: la pauta de cada persona genera el turno; las casillas pintadas son excepciones */
function pa(p,k){var v=p&&p[k];return (v===undefined||v===null||v==='')?PAUTA[k]:v;}
function fila(p,t,wd){var a=pa(p,t==='N'?'n':'d');return (a&&a[wd])||'';}
function lunes(date){var a=date.split('-'),d=new Date(+a[0],+a[1]-1,+a[2]);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function semIdx(date){var a=lunes(date).split('-'),b=ANCLA.split('-');
  return Math.round((new Date(+a[0],+a[1]-1,+a[2])-new Date(+b[0],+b[1]-1,+b[2]))/6048e5);}
function ovr(pid,date){var a=TU[date.slice(0,7)];return (a&&a[pid]&&a[pid][+date.slice(8)])||'';}
function turnoAuto(p,date){
  var wd=new Date(+date.slice(0,4),+date.slice(5,7)-1,+date.slice(8)).getDay();
  var r=pa(p,'rot');
  if(r==='dia')return fila(p,'D',wd)?'D':'L';
  if(r==='noche')return fila(p,'N',wd)?'N':'L';
  var par=((semIdx(date)%2)+2)%2;          // 0 = semana del ancla
  var t=(pa(p,'grp')==='A')===(par===0)?'D':'N';
  return fila(p,t,wd)?t:'L';
}
function turnoDe(p,date){return ovr(p.id,date)||turnoAuto(p,date);}
function horario(p,date){
  var t=turnoDe(p,date);if(t==='L')return null;
  var wd=new Date(+date.slice(0,4),+date.slice(5,7)-1,+date.slice(8)).getDay();
  var f=fila(p,t,wd);if(!f)return null;
  var q=f.split('-'),E=mins(date,q[0]),S=mins(date,q[1]);if(S<=E)S+=1440;
  return {t:t,e:E,s:S,alm:+pa(p,'alm')||0,txt:f};
}

    h+='</tr>';});

/* ARCHIVOS (fotos / documentos, partidos en trozos de 700 KB) */
function comprimir(file,M,q){return new Promise(function(ok,ko){var r=new FileReader();r.onerror=ko;r.onload=function(){var im=new Image();im.onerror=ko;im.onload=function(){var k=Math.min(1,M/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q));};im.src=r.result;};r.readAsDataURL(file);});}
function leerDU(file){return new Promise(function(ok,ko){var r=new FileReader();r.onerror=ko;r.onload=function(){ok(r.result);};r.readAsDataURL(file);});}
function subirArch(owner,file){
  var prom=file.type.indexOf('image/')===0?comprimir(file,1500,.78):leerDU(file);
  return prom.then(function(du){
    if(du.length>7000000){toast('Archivo muy grande (máx ~5 MB)');return null;}
    var aid='RH-A-'+uid(),parts=[];for(var i=0;i<du.length;i+=700000)parts.push(du.slice(i,i+700000));
    var b=db.batch();parts.forEach(function(t,i){b.set(col.doc('RH-AC-'+aid.slice(5)+'-'+i),{tipo:'rh_chunk',d:t});});
    b.set(col.doc(aid),{tipo:'rh_arch',owner:owner,nombre:file.name||('foto-'+hoy()+'.jpg'),mime:file.type||'application/octet-stream',n:parts.length,fecha:hoy(),ts:Date.now()});
    return b.commit().then(function(){return aid;});
  });
}
function archBox(owner){return '<div class="ab" data-o="'+owner+'">'+archInner(owner)+'</div>';}
function archInner(owner){
  var l=ARCH.filter(function(a){return a.owner===owner;}).sort(function(a,b){return b.ts-a.ts;});
  return '<div class="att">'+l.map(function(a){return '<span class="at">'+(a.mime.indexOf('image/')===0?'🖼':'📄')+' <a onclick="abrirArch(\''+a.id+'\')">'+esc(a.nombre)+'</a><small class="muted">'+fmt(a.fecha)+'</small><a onclick="delArch(\''+a.id+'\')" style="color:#b91c1c">✕</a></span>';}).join('')+'</div>'+
  '<label class="btn o s">📎 Subir archivo<input type="file" multiple style="display:none" onchange="addArch(\''+owner+'\',this)"></label> '+
  '<label class="btn o s">📷 Tomar foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addArch(\''+owner+'\',this)"></label>';
}
function addArch(owner,inp){var fl=Array.prototype.slice.call(inp.files);inp.value='';toast('Subiendo…');
  fl.reduce(function(p,f){return p.then(function(){return subirArch(owner,f);});},Promise.resolve()).then(function(){toast('Listo');});}
function abrirArch(id){var a=ARCH.filter(function(x){return x.id===id;})[0];if(!a)return;toast('Abriendo…');
  var ps=[];for(var i=0;i<a.n;i++)ps.push(col.doc('RH-AC-'+id.slice(5)+'-'+i).get());
  Promise.all(ps).then(function(r){var du=r.map(function(d){return d.data().d;}).join('');var bin=atob(du.split(',')[1]);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:a.mime}));
    if(a.mime.indexOf('image/')===0||a.mime==='application/pdf')window.open(url,'_blank');else{var l=document.createElement('a');l.href=url;l.download=a.nombre;l.click();}});}

/* TIMBRADAS: importar */
var IMP=null;
function importar(){ $('fileimp').click(); }
function leerImp(inp){
  var f=inp.files[0];inp.value='';if(!f)return;
  var r=new FileReader();r.onload=function(){
    var wb=XLSX.read(r.result,{type:'array',cellDates:false});var ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    if(rows.some(function(r){return r[0]==='TARJETA DE REGISTROS';})){tarjeta(rows,f);return;}
    var hi=0;for(var i=0;i<Math.min(rows.length,15);i++){if(rows[i].filter(function(c){return String(c).trim();}).length>=2){hi=i;break;}}
    IMP={file:f,head:rows[hi].map(function(x,i){return String(x||('Col '+(i+1)));}),rows:rows.slice(hi+1)};
    mapImp();
  };r.readAsArrayBuffer(f);
}
function guess(re){for(var i=0;i<IMP.head.length;i++)if(re.test(norm(IMP.head[i])))return i;return -1;}
function mapImp(){
  var g={p:guess(/cedula|documento|identific|nit|\bcc\b|codigo|empleado|nombre/),f:guess(/fecha|dia|date/),h:guess(/hora|time|marc|timb|entrada/),h2:guess(/salida/)};
  if(g.p===guess(/nombre/)&&guess(/cedula|documento|identific/)>=0)g.p=guess(/cedula|documento|identific/);
  var opt=function(sel,none){return (none?'<option value="-1">— ninguna —</option>':'')+IMP.head.map(function(h,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(h)+'</option>';}).join('');};
  var prev=IMP.rows.slice(0,4).map(function(r){return '<tr>'+IMP.head.map(function(h,i){return '<td>'+esc(cellTxt(r[i]))+'</td>';}).join('')+'</tr>';}).join('');
  $('sheet').innerHTML='<h2>Importar timbradas<button class="btn o s" onclick="cerrar()">✕</button></h2><div class="muted">Archivo: '+esc(IMP.file.name)+' · '+IMP.rows.length+' filas. Indica qué columna es cada cosa:</div>'+
  '<div class="f" style="margin-top:8px"><div><label>Persona (cédula o nombre)</label><select id="m_p">'+opt(g.p)+'</select></div><div><label>Fecha (o fecha+hora)</label><select id="m_f">'+opt(g.f)+'</select></div><div><label>Hora (puede traer varias)</label><select id="m_h">'+opt(g.h,1)+'</select></div><div><label>Hora 2 (ej. salida)</label><select id="m_h2">'+opt(g.h2,1)+'</select></div></div>'+
  '<div class="wrap" style="max-height:140px"><table><tr>'+IMP.head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'+prev+'</table></div>'+
  '<div style="margin-top:12px"><button class="btn g" onclick="aplicarImp()">Importar y cotejar</button></div>';
  $('ov').classList.add('on');
}
function cellTxt(c){if(typeof c==='number'){if(c>20000){var q=serie(c);return q.d+(q.t?' '+q.t:'');}if(c>=0&&c<1)return horasDe(c)[0]||'';}if(c instanceof Date)return c.getFullYear()+'-'+pad(c.getMonth()+1)+'-'+pad(c.getDate())+' '+pad(c.getHours())+':'+pad(c.getMinutes());return String(c==null?'':c);}
function serie(c){var d=Math.floor(c),fr=Math.round((c-d)*1440),u=new Date(Date.UTC(1899,11,30+d));return {d:u.getUTCFullYear()+'-'+pad(u.getUTCMonth()+1)+'-'+pad(u.getUTCDate()),t:fr?pad(Math.floor(fr/60))+':'+pad(fr%60):''};}
function parseFecha(c){
  if(typeof c==='number'&&c>20000)return serie(c);
  if(c instanceof Date){var d=new Date(c.getTime()+30000);return {d:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),t:(d.getHours()||d.getMinutes())?pad(d.getHours())+':'+pad(d.getMinutes()):''};}
  var s=String(c||'').trim(),m;
  if((m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T]+(\d{1,2}):(\d{2}))?/)))return {d:m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]),t:m[4]?pad(+m[4])+':'+m[5]:''};
  if((m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})(?:[ T]+(\d{1,2}):(\d{2}))?/))){var y=+m[3];if(y<100)y+=2000;return {d:y+'-'+pad(+m[2])+'-'+pad(+m[1]),t:m[4]?pad(+m[4])+':'+m[5]:''};}
  return null;
}
function horasDe(c){
  if(c instanceof Date){return [pad(c.getHours())+':'+pad(c.getMinutes())];}
  if(typeof c==='number'&&c>=0){var t=Math.round((c-Math.floor(c))*1440);if(!t&&c<1)return [];return [pad(Math.floor(t/60))+':'+pad(t%60)];}
  var o=[],re=/(\d{1,2}):(\d{2})/g,m,s=String(c||'');while((m=re.exec(s)))o.push(pad(+m[1])+':'+m[2]);return o;
}
function buscaP(v){
  var d=dig(v),n=norm(v),best=null;
  var all=pList(false);
  if(d.length>=5)for(var i=0;i<all.length;i++)if(dig(all[i].cedula)===d)return all[i];
  for(var j=0;j<all.length;j++)if(norm(all[j].nombre)===n)return all[j];
  var tk=n.split(' ').filter(function(x){return x.length>1;});
  if(tk.length>=2)for(var k=0;k<all.length;k++){var pn=norm(all[k].nombre);if(tk.every(function(t){return pn.indexOf(t)>=0;}))return all[k];}
  return best;
}
function aplicarImp(){
  var ip=+$('m_p').value,ifc=+$('m_f').value,ih=+$('m_h').value,ih2=+$('m_h2').value;
  var nuevos={},sin={},tot=0,ok=0,pers={};
  IMP.rows.forEach(function(r){
    var pv=r[ip];if(pv===''||pv==null)return;var f=parseFecha(r[ifc]);if(!f)return;
    var hs=[];if(ih>=0)hs=hs.concat(horasDe(r[ih]));if(ih2>=0)hs=hs.concat(horasDe(r[ih2]));
    if(!hs.length&&f.t)hs=[f.t];if(!hs.length)return;
    tot+=hs.length;var p=buscaP(pv);
    if(!p){sin[String(pv)]=(sin[String(pv)]||0)+hs.length;return;}
    pers[p.id]=1;
    hs.forEach(function(h){var key=f.d+' '+h;var m=f.d.slice(0,7);(nuevos[m]=nuevos[m]||{});(nuevos[m][p.id]=nuevos[m][p.id]||[]).push(key);ok++;});
  });
  Object.keys(nuevos).forEach(function(m){var out={};Object.keys(nuevos[m]).forEach(function(pid){var set={};((MA[m]||{})[pid]||[]).forEach(function(x){set[x]=1;});nuevos[m][pid].forEach(function(x){set[x]=1;});out[pid]=Object.keys(set).sort();});
    col.doc('RH-M-'+m).set({tipo:'rh_marc',mes:m,m:out},{merge:true});});
  subirArch('TIMBRADAS',IMP.file);
  var sk=Object.keys(sin);
  $('sheet').innerHTML='<h2>Importación lista<button class="btn" onclick="cerrar()">Ver resultado</button></h2><div class="card">✅ '+ok+' marcaciones de '+Object.keys(pers).length+' personas cargadas (de '+tot+' leídas).<br><small class="muted">El archivo original quedó guardado en “Archivos”.</small></div>'+
  (sk.length?'<div class="card" style="background:#fef3c7"><b>⚠ '+sk.length+' nombres/cédulas sin coincidir</b><div class="muted">Agrégalos como personas o corrige su cédula en la hoja de vida y vuelve a importar el mismo archivo (no duplica).</div><div style="margin-top:6px;font-size:12.5px">'+sk.slice(0,40).map(function(k){return esc(k)+' ('+sin[k]+')';}).join(' · ')+'</div></div>':'');
  tab='cot';draw();
}


/* Formato "Tarjeta de registros" (reloj biométrico de Gestión Humana): un bloque por persona */
function tarjeta(rows,f){
  var B=[],cur=null,dmin='9',dmax='0';
  rows.forEach(function(r){
    var a=r[0];
    if(a==='Nombre'){cur={nombre:String(r[1]).replace(/\s+/g,' ').trim(),cedula:'',cargo:'',ingreso:'',dias:[]};B.push(cur);return;}
    if(!cur)return;
    if(a==='Nº Identificador')cur.cedula=String(r[1]).trim();
    else if(a==='Función')cur.cargo=String(r[1]).replace(/\s+/g,' ').trim();
    else if(a==='Libreta'){var i=r.indexOf('Ingreso ');if(i>=0&&typeof r[i+1]==='number'&&r[i+1]>20000)cur.ingreso=serie(r[i+1]).d;}
    else if(typeof a==='string'){var m=a.match(/^(\d\d)\/(\d\d)\/(\d\d) - /);if(m){var d='20'+m[3]+'-'+m[2]+'-'+m[1];if(d<dmin)dmin=d;if(d>dmax)dmax=d;
      var hs=[];for(var c=1;c<=6;c++){horasDe(r[c]).forEach(function(h){hs.push(h);});}cur.dias.push({d:d,h:hs});}}
  });
  IMP={tarjeta:B,file:f,desde:dmin,hasta:dmax};
  var nuevos=B.filter(function(b){return !buscaP(b.cedula||b.nombre);});
  var tit=function(x){return x.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});};
  $('sheet').innerHTML='<h2>Reporte de timbradas detectado<button class="btn o s" onclick="cerrar()">✕</button></h2>'+
  '<div class="card">Periodo <b>'+fmt(dmin)+' a '+fmt(dmax)+'</b> · '+B.length+' personas · '+B.reduce(function(a,b){return a+b.dias.reduce(function(x,d){return x+d.h.length;},0);},0)+' marcaciones.</div>'+
  (nuevos.length?'<div class="muted" style="margin-bottom:6px">Estas personas no están en el sistema. Marca las que quieres crear (se usan cédula, nombre, cargo e ingreso del reporte):</div>'+nuevos.map(function(b,i){return '<label style="display:block;padding:3px 0"><input type="checkbox" class="nw" data-i="'+B.indexOf(b)+'" '+(b.cedula==='1073700007'?'':'checked')+'> '+esc(tit(b.nombre))+' <span class="muted">· CC '+esc(b.cedula)+' · '+esc(tit(b.cargo))+'</span></label>';}).join(''):'<div class="card">Todas las personas ya existen.</div>')+
  '<div style="margin-top:12px"><button class="btn g" onclick="aplicarTarjeta()">Cargar timbradas</button></div>';
  $('ov').classList.add('on');
}
function aplicarTarjeta(){
  var B=IMP.tarjeta,tit=function(x){return x.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();});};
  var crear={};Array.prototype.forEach.call(document.querySelectorAll('.nw'),function(e){if(e.checked)crear[e.getAttribute('data-i')]=1;});
  var bt=db.batch(),ids={};
  B.forEach(function(b,i){var p=buscaP(b.cedula||b.nombre);
    if(p){ids[i]=p.id;if(!p.cedula&&b.cedula)bt.set(col.doc(p.id),{cedula:b.cedula},{merge:true});}
    else if(crear[i]){var id='RH-P-'+uid();ids[i]=id;bt.set(col.doc(id),{tipo:'rh_persona',nombre:tit(b.nombre),cedula:b.cedula,cargo:tit(b.cargo),ingreso:b.ingreso,activo:true,ts:Date.now()});}});
  bt.commit();
  var nuevos={},ok=0,pers={};
  B.forEach(function(b,i){var pid=ids[i];if(!pid)return;b.dias.forEach(function(d){d.h.forEach(function(h){var m=d.d.slice(0,7);(nuevos[m]=nuevos[m]||{});(nuevos[m][pid]=nuevos[m][pid]||[]).push(d.d+' '+h);ok++;pers[pid]=1;});});});
  Object.keys(nuevos).forEach(function(m){var out={};Object.keys(nuevos[m]).forEach(function(pid){var set={};((MA[m]||{})[pid]||[]).forEach(function(x){set[x]=1;});nuevos[m][pid].forEach(function(x){set[x]=1;});out[pid]=Object.keys(set).sort();});
    col.doc('RH-M-'+m).set({tipo:'rh_marc',mes:m,m:out},{merge:true});});
  var cb={};cb['i'+Date.now().toString(36)]={d:IMP.desde,h:IMP.hasta};col.doc('RH-COB').set({tipo:'rh_cob',r:cb},{merge:true});
  subirArch('TIMBRADAS',IMP.file);
  $('sheet').innerHTML='<h2>Listo<button class="btn" onclick="cerrar()">Ver resultado</button></h2><div class="card">✅ '+ok+' marcaciones de '+Object.keys(pers).length+' personas, del '+fmt(IMP.desde)+' al '+fmt(IMP.hasta)+'.<br><small class="muted">El reporte original quedó guardado en “Archivos”.</small></div>';
  mes=IMP.desde.slice(0,7);tab='cot';draw();
}

/* TIMBRADAS: cotejo */
function clasif(a,b,res){ // reparte minutos [a,b) en diurna / nocturna / dominical
  for(var t=a;t<b;t++){var d=new Date(t*60000),h=d.getHours(),n=(h>=21||h<6),dom=d.getDay()===0;
    var k=dom?(n?'hend':'hedd'):(n?'hen':'hed');res[k]=(res[k]||0)+1;}
}
function cubierto(date){return !COB.length||COB.some(function(r){return date>=r.d&&date<=r.h;});}
function justif(pid,date){var r=NOV.filter(function(n){return n.pid===pid&&n.desde<=date&&(n.hasta||n.desde)>=date&&(JUST.indexOf(n.tipoN)>=0||n.tipoN==='Falta');})[0];return r?r.tipoN:'';}
function mar(pid){var o=[];Object.keys(MA).forEach(function(m){(MA[m][pid]||[]).forEach(function(k){o.push(mins(k.slice(0,10),k.slice(11)));});});return o.sort(function(a,b){return a-b;});}

function calc(p){
  var n=dimes(mes),PU=mar(p.id);
  var R={p:p,prog:0,trab:0,faltas:0,just:0,tardes:0,minTarde:0,ant:0,sinSal:0,sinTurno:0,neto:0,ordin:0,
         he:{hed:0,hen:0,hedd:0,hend:0},heMin:0,det:[],sem:{}};
  var wins=[];
  for(var d=-2;d<=n+2;d++){
    var dt=new Date(+mes.slice(0,4),+mes.slice(5)-1,d);
    var date=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
    var H=horario(p,date);if(!H)continue;
    wins.push([H.e-120,H.s+240]);
    if(d<1||d>n||!cubierto(date))continue;
    R.prog++;
    var j=justif(p.id,date),row={fecha:date,t:H.t,prog:H.txt,ent:'',sal:'',neto:0,extra:0,estado:''};
    var inw=PU.filter(function(x){return x>=H.e-120&&x<=H.s+240;});
    if(!inw.length){
      if(j&&j!=='Falta'){R.just++;row.estado='Justificado: '+j;}
      else {R.faltas++;row.estado=j==='Falta'?'Falta (registrada)':'Sin timbrada';}
    } else {
      R.trab++;var en=inw[0],sa=inw[inw.length-1],est=[];
      row.ent=hm(en);
      var tarde=Math.max(0,en-H.e);if(tarde>CONF.tol){R.tardes++;R.minTarde+=tarde;est.push('Tarde '+tarde+' min');}
      if(sa-en>=120){
        row.sal=hm(sa);
        var ant=Math.max(0,H.s-sa);if(ant>CONF.tol){R.ant++;est.push('Salió '+ant+' min antes');}
        row.neto=Math.max(0,sa-en-H.alm);row.ini=en;row.fin=sa;
      } else {R.sinSal++;est.push('Falta salida');}
      row.estado=est.join(' · ')||'OK';
    }
    R.neto+=row.neto;R.det.push(row);
    var L=lunes(date);(R.sem[L]=R.sem[L]||{neto:0,ord:0,ex:0,dias:[]}).neto+=row.neto;R.sem[L].dias.push(row);
  }
  // 42 h ordinarias por semana; lo que pase son extras, contadas desde el final de cada jornada
  Object.keys(R.sem).forEach(function(L){
    var w=R.sem[L],acum=0;
    w.dias.forEach(function(row){
      if(!row.neto)return;
      var antes=acum;acum+=row.neto;
      if(acum<=ORD)return;
      var ex=Math.min(row.neto,acum-ORD);  // minutos extra de esta jornada
      row.extra=ex;R.heMin+=ex;
      clasif(row.fin-ex,row.fin,R.he);     // se cuentan al final de la jornada
    });
    w.ord=Math.min(w.neto,ORD);w.ex=Math.max(0,w.neto-ORD);R.ordin+=w.ord;
  });
  PU.forEach(function(x){var d=new Date(x*60000);var date=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(date.slice(0,7)!==mes)return;if(!wins.some(function(w){return x>=w[0]&&x<=w[1];}))R.sinTurno++;});
  R.nov={};NOV.filter(function(x){return x.pid===p.id&&x.desde.slice(0,7)<=mes&&(x.hasta||x.desde).slice(0,7)>=mes;})
    .forEach(function(x){R.nov[x.tipoN]=(R.nov[x.tipoN]||0)+(x.tipoN==='Hora extra'?(x.horas||0):1);});
  return R;
}
function vCot(){
  var l=pList(true).map(calc).filter(function(r){return r.prog||r.sinTurno;});
  var h=mesBar('<button class="btn g" onclick="importar()">⬆ Importar timbradas</button><button class="btn o" onclick="exportar()">⬇ Exportar a Excel</button>')+
  '<input type="file" id="fileimp" accept=".xlsx,.xls,.csv,.txt" style="display:none" onchange="leerImp(this)">'+
  '<div class="card muted">Ordinarias: <b>42 h por semana</b> (lunes a domingo); lo que pase se cuenta como extra. Se descuenta el almuerzo de cada pauta. Tolerancia <input type="number" style="width:60px" value="'+CONF.tol+'" onchange="CONF.tol=+this.value;sv();draw()"> min. Nocturna = 9 pm a 6 am · dominical = domingo (festivos aún no).</div>';
  if(!Object.keys(MA).length)h+='<div class="card">Aún no hay timbradas cargadas. Pulsa “Importar timbradas” con el reporte que te pasa Gestión Humana.</div>';
  if(!l.length)return h+'<div class="card muted">Este mes no hay personal con turno.</div>';
  h+='<div class="wrap"><table><tr><th class="l">Persona</th><th>Días prog.</th><th>Trabajó</th><th>Faltas</th><th>Justif.</th><th>Tardes</th><th>Sal. antes</th><th>Sin salida</th><th>Marcó sin turno</th><th>Horas netas</th><th>Ordinarias</th><th>HE diurna</th><th>HE nocturna</th><th>HE dom. diur.</th><th>HE dom. noct.</th><th>Total HE</th></tr>';
  l.forEach(function(r){h+='<tr><td class="l"><a style="cursor:pointer;color:#0f2942;font-weight:700" onclick="detCot(\''+r.p.id+'\')">'+esc(r.p.nombre)+'</a></td><td>'+r.prog+'</td><td>'+r.trab+'</td><td>'+bad(r.faltas)+'</td><td>'+r.just+'</td><td>'+warn(r.tardes)+'</td><td>'+warn(r.ant)+'</td><td>'+warn(r.sinSal)+'</td><td>'+warn(r.sinTurno)+'</td><td>'+hh(r.neto)+'</td><td>'+hh(r.ordin)+'</td><td>'+hh(r.he.hed)+'</td><td>'+hh(r.he.hen)+'</td><td>'+hh(r.he.hedd)+'</td><td>'+hh(r.he.hend)+'</td><td><b>'+hh(r.heMin)+'</b></td></tr>';});
  return h+'</table></div><div class="muted" style="margin-top:6px">Horas en formato decimal. Toca un nombre para ver semana por semana y día por día.</div>';
}
function bad(n){return n?'<span class="pill p-b">'+n+'</span>':'0';}
function warn(n){return n?'<span class="pill p-w">'+n+'</span>':'0';}
function sv(){try{localStorage.setItem('rh_conf',JSON.stringify(CONF));}catch(e){}}
function detCot(pid){
  var r=calc(P[pid]);
  var sem=Object.keys(r.sem).sort().map(function(L){var w=r.sem[L];return '<tr><td>Semana del '+fmt(L)+'</td><td>'+hh(w.neto)+'</td><td>'+hh(w.ord)+'</td><td><b>'+hh(w.ex)+'</b></td></tr>';}).join('');
  $('sheet').innerHTML='<h2>'+esc(r.p.nombre)+' · '+mes+'<button class="btn o s" onclick="cerrar()">✕</button></h2>'+
  '<table style="margin-bottom:10px"><tr><th class="l">Semana</th><th>Netas</th><th>Ordinarias</th><th>Extras</th></tr>'+sem+'</table>'+
  '<div class="wrap"><table><tr><th>Día</th><th>Turno</th><th>Programado</th><th>Entrada</th><th>Salida</th><th>Netas</th><th>Extra</th><th class="l">Estado</th></tr>'+
  r.det.map(function(x){var ok=x.estado==='OK';
    return '<tr><td>'+fmt(x.fecha).slice(0,5)+'</td><td>'+x.t+'</td><td class="muted">'+x.prog+'</td><td>'+x.ent+'</td><td>'+x.sal+'</td><td>'+(x.neto?hh(x.neto):'')+'</td><td>'+(x.extra?hh(x.extra):'')+'</td><td class="l"><span class="pill '+(ok?'p-ok':x.estado.indexOf('Justificado')===0?'p-i':(x.estado.indexOf('Sin')===0||x.estado.indexOf('Falta')===0)?'p-b':'p-w')+'">'+esc(x.estado)+'</span></td></tr>';}).join('')+'</table></div>';
  $('ov').classList.add('on');
}
function exportar(){
  var l=pList(true).map(calc).filter(function(r){return r.prog||r.sinTurno;});
  var a=[['Persona','Cédula','Cargo','Equipo','Días prog.','Trabajó','Faltas','Justificados','Tardes','Min tarde','Salidas antes','Sin salida','Marcó sin turno','Horas netas','Ordinarias','HE diurna','HE nocturna','HE dom. diurna','HE dom. nocturna','Total HE']];
  var d=[['Persona','Fecha','Turno','Programado','Entrada','Salida','Horas netas','Extra','Estado']];
  var w=[['Persona','Semana (lunes)','Horas netas','Ordinarias','Extras']];
  l.forEach(function(r){
    a.push([r.p.nombre,r.p.cedula,r.p.cargo,r.p.equipo,r.prog,r.trab,r.faltas,r.just,r.tardes,r.minTarde,r.ant,r.sinSal,r.sinTurno,+hh(r.neto),+hh(r.ordin),+hh(r.he.hed),+hh(r.he.hen),+hh(r.he.hedd),+hh(r.he.hend),+hh(r.heMin)]);
    r.det.forEach(function(x){d.push([r.p.nombre,x.fecha,x.t,x.prog,x.ent,x.sal,+hh(x.neto),x.extra?+hh(x.extra):0,x.estado]);});
    Object.keys(r.sem).sort().forEach(function(L){var s=r.sem[L];w.push([r.p.nombre,L,+hh(s.neto),+hh(s.ord),+hh(s.ex)]);});
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Resumen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(w),'Semanas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),'Detalle');
  XLSX.writeFile(wb,'Personal_'+mes+'.xlsx');
}
